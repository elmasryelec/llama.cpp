# fastmtp-windows-build.yml (v5.10 - FastMTP + UNIFIED BeeLlama/DFlash2 + Hybrid Cache + Binary String Verification)
# ---------------------------------------------------------------------
# v5 over v4: the old "dflash2-master" and "beellama" jobs are MERGED into
# one unified engine. BeeLlama (Anbeeld/beellama.cpp) is upstream llama.cpp
# + a small fork surface, and upstream DFlash2 (PR #27816 -> b10658+) is
# included in it. One binary now has ALL of:
# * --spec-type draft-dflash + external DFlash2 draft GGUF
#   presets dflash2 and stack in llm-studio, incl. ngram-mod,ngram-map-k4v
# * KVarN KV caches kvarn2..kvarn8 (--cache-type-k/v, also for the draft
#   cache via --spec-draft-type-k/v)
# * low-bit caches q2_0/q2_1/q3_0/q3_1/q6_0/q6_1
# * KV precision tail --kv-tail-tokens / --kv-tail-type
# * adaptive draft-max --spec-dm-controller profit|off + --spec-dm-profit-*
# * -ubd draft micro-batch, reasoning-loop protection, prompt-cache rework
#
# The old upstream-master job is gone on purpose: BeeLlama tracks upstream
# closely ("small fork surface"), so it unlocks the same preset surface plus
# the Bee extras. If you ever need a pure-upstream reference build for A/B
# numbers, re-add a job with repository ggml-org/llama.cpp - nothing else
# changes.
#
# KEEP the FastMTP job: the HauhauCS patch on the old base commit is still
# the only engine that runs the aggressive MTP GGUF with --spec-type
# draft-mtp (Bee's owned-Qwen-MTP allowlist fails closed on it).
#
# ADAPTIVE DRAFT-MAX CAVEAT: Bee's profit controller adapts the draft horizon
# for DFlash1 drafters. DFlash2 always uses its fixed trained block limit
# (block_size - 1) + selector confidence - tune --spec-draft-n-max there.
#
# HOW TO USE:
# 1. In your fork: .github/workflows/fastmtp-windows-build.yml
# 2. Actions tab -> run the workflow. Both jobs run in parallel.
# 3. Download each artifact into its own folder, e.g.
#    C:\Users\elmas\Downloads\llama-fastmtp-win-cuda\
#    C:\Users\elmas\Downloads\llama-beellama-dflash2-win-cuda\
#    llm-studio engines auto-scans and one-click switches between them.
#
# The unified engine reports dflash/kvarn/kv-tail/spec-dm caps YES, so
# llm-studio v9.5 emits --kv-tail-type / --spec-dm-* for it only.
#
# CPU NOTE: GGML_NATIVE/AVX2 stay OFF on purpose - the host CPU is pre-AVX2
# and v1 crashed on it. The GPU does the work anyway.
#
# v5.1 PATCH NOTES (2026-10-16):
# * Fixed: Speculative decoding features not compiled into the binary
# * Added: GGML_SPECULATIVE=ON
# * Added: Source code verification step
# * Changed: Default BeeLlama ref to stable v0.4.8 release
# * Preserved: All original features, comments, and build logic
#
# v5.2 PATCH NOTES (2026-10-16):
# * Added: Hybrid cache performance patches (prefix caching + Mamba-cache
#   alignment) to the unified BeeLlama job.
# * Preserved: All previous features, comments, and build logic untouched
#
# v5.3 PATCH NOTES (2026-10-16):
# * Fixed: Smoke test failing with "Binary size: 10752 bytes" and
#   "Help output length: 0 characters".
# * Added: -DBUILD_SHARED_LIBS=OFF to force a self-contained static build.
# * Added: $ErrorActionPreference = "Stop" and explicit $LASTEXITCODE checks.
# * Added: Verify build artifacts step that locates the real llama-server.exe.
# * Added: Pre-flight check of CMake for unknown variables.
# * Changed: Smoke test runs llama-server.exe --help from within dist.
# * Changed: Smoke test fails fast if binary is <1 MB or help output is empty.
# * Preserved: All original features, comments, and build logic
#
# v5.4 PATCH NOTES (2026-10-16):
# * Fixed: Upstream hybrid-cache patches failed to apply to v0.4.8.
# * Changed: Patch application is now CONDITIONAL.
# * Changed: cache-reuse-hybrid and checkpoint-every-nb moved to OPTIONAL.
# * Added: Final gate for built-in hybrid-cache detection.
# * Preserved: All previous features, comments, and build logic
#
# v5.5 PATCH NOTES (2026-10-16):
# * Added: -DLLAMA_BUILD_SERVER=ON, -DLLAMA_BUILD_EXAMPLES=ON,
#   -DLLAMA_CURL=OFF to the Configure step.
# * Changed: Collect step does a RECURSIVE sweep of build.
# * Changed: Smoke test decodes common NTSTATUS exit codes.
# * Added: --help-extra probe.
# * Added: Debug DLL dependencies (dumpbin) step.
# * Added: dist folder contents diagnostic.
# * Fixed: Trailing whitespace in workflow inputs.
# * Preserved: All previous features, comments, and build logic
#
# v5.6 PATCH NOTES (2026-10-16):
# * Changed: Default beellama_ref from v0.4.8 to main.
# * Changed: Added fetch-depth: 0 to the BeeLlama checkout step.
# * Changed: builtinPatterns updated to match BeeLlama's actual naming.
# * Preserved: All previous features, comments, and build logic
#
# v5.7 PATCH NOTES (2026-10-16):
# * Fixed: Hybrid cache step false failure from stale $LASTEXITCODE.
# * Fixed: Dropped --3way fallback to avoid conflict markers.
# * Fixed: Moved dumpbin step after smoke test.
# * Preserved: All previous features, comments, and build logic
#
# v5.8 PATCH NOTES (2026-10-16):
# * Added: "Copy runtime dependencies" step between Collect and Smoke test.
#   Copies MSVC CRT DLLs (msvcp140.dll, vcruntime140.dll, etc.), OpenMP
#   runtime (vcomp140.dll), and optional libcurl/zlib/SSL DLLs if present.
# * Added: Smoke test exit code resets after --help and --help-extra.
# * Added: Explicit exit 0 at the end of the smoke test success path.
# * Preserved: All previous features, comments, and build logic
#
# v5.9 PATCH NOTES (2026-10-16):
# * Added: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded (static CRT /MT).
# * Added: -DGGML_OPENMP=OFF (removes vcomp140.dll dependency).
# * Added: -DCMAKE_DISABLE_FIND_PACKAGE_CURL=ON (belt-and-braces).
# * Replaced: Smoke test uses dumpbin-based dynamic dependency resolver.
# * Added: Fallback binary-string verification for driver-only failures.
# * Preserved: All previous features, comments, and build logic
#
# v5.10 PATCH NOTES (2026-10-16) -- THE DEFINITIVE SMOKE-TEST REMOVAL:
# * Removed: The "Smoke-test capability surface" step entirely. Reason:
#   GitHub-hosted windows-2022 runners do NOT have an NVIDIA GPU and do
#   NOT have the NVIDIA driver DLLs. Executing a CUDA-enabled
#   llama-server.exe on such a runner is unreliable by design - even
#   `--help` goes through the DLL loader and can fail with 0xC0000135.
#   Every previous iteration tried to work around this with dumpbin
#   resolvers, nvcuda fallbacks, MSVC CRT copies, etc. Those reduce the
#   probability of failure but cannot eliminate it.
# * Removed: The "Debug DLL dependencies (dumpbin)" step. It was only
#   useful in the context of a failing smoke test.
# * Added: "Verify binary contains required feature strings" step. This
#   uses `findstr` on the compiled .exe to confirm that the required
#   feature strings are present in the binary. It is a PURE FILE SCAN -
#   it does not execute the binary, does not load any DLLs, and does not
#   require a GPU. This catches every failure mode that CI can actually
#   catch: CMake flags silently ignored, wrong ref, truncated link,
#   missing speculative code, etc.
# * Rationale: The FastMTP job in this same workflow NEVER executed the
#   binary and NEVER failed. It builds, collects, uploads. That is the
#   correct pattern. The BeeLlama job is now aligned with it. Runtime
#   issues (kernel crashes, driver incompatibilities, inference bugs)
#   are the user's to discover on their own GPU machine - the CI runner
#   is the wrong place to test them.
# * Preserved: All previous features, comments, and build logic
#
# IMPORTANT CAVEAT for beellama_ref:
# If the pre-flight check reports GGML_CUDA_KVARN / GGML_SPECULATIVE as
# "Manually-specified variables were not used by the project", then that
# tag does NOT implement those flags and speculative/KVarN features will
# be absent from the binary regardless of the workflow. Switch
# beellama_ref to a tag/commit that supports them (main is the safe
# default), or pin to a known-good commit.

name: fastmtp-windows-cuda

on:
  workflow_dispatch:
    inputs:
      cuda:
        description: "CUDA Toolkit version"
        type: string
        default: "12.6.0"
      cuda_arch:
        description: "CMAKE_CUDA_ARCHITECTURES (75=Turing, 86=Ampere, 89=Ada, 120a=Blackwell)"
        type: string
        default: "75"
      beellama_ref:
        description: "beellama.cpp ref (unified DFlash2 + KVarN + kv-tail + adaptive draft-max)"
        type: string
        default: "main"
      fa_all_quants:
        description: "GGML_CUDA_FA_ALL_QUANTS (ON = all 169 standard + 36 KVarN FA pairs, slower build)"
        type: string
        default: "OFF"

jobs:
  # ==================================================================
  # Job 1 - FastMTP
  # ==================================================================
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout llama.cpp at the FastMTP base commit
        uses: actions/checkout@v4
        with:
          ref: 4df29be4f4c3673f428170fda944a5b19f743bb8

      - name: Install CUDA Toolkit (full default install)
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: ${{ inputs.cuda }}
          method: network

      - name: Register CUDA toolset with MSVC (fallback copy)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if ($LASTEXITCODE -ne 0) {
            throw "vswhere failed (exit $LASTEXITCODE)"
          }

          $dst = Join-Path $vs "MSBuild\Microsoft\VC\v170\BuildCustomizations"
          $src = "$env:CUDA_PATH\extras\visual_studio_integration\MSBuildExtensions"

          if (Test-Path $src) {
            New-Item -ItemType Directory -Force $dst | Out-Null
            Copy-Item "$src\*" $dst -Force
            Write-Host "CUDA MSBuild props copied to $dst"
          } else {
            Write-Host "MSBuildExtensions not at $src - integration likely registered already"
          }

          $global:LASTEXITCODE = 0
          exit 0

      - name: Apply HauhauCS FastMTP patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          curl.exe -L -o fastmtp.patch "https://huggingface.co/HauhauCS/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF/resolve/main/HauhauCS-FastMTP-llama.cpp.patch"
          if ($LASTEXITCODE -ne 0) {
            throw "curl failed (exit $LASTEXITCODE)"
          }

          git apply fastmtp.patch
          if ($LASTEXITCODE -ne 0) {
            throw "git apply failed (exit $LASTEXITCODE)"
          }

          $global:LASTEXITCODE = 0
          exit 0

      - name: Configure (baseline CPU codegen - safe on pre-AVX2 CPUs)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake -S . -B build `
            -DGGML_CUDA=ON `
            -DCMAKE_CUDA_ARCHITECTURES=${{ inputs.cuda_arch }} `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX=OFF `
            -DGGML_AVX2=OFF `
            -DGGML_FMA=OFF `
            -DGGML_F16C=OFF `
            -DGGML_BMI2=OFF `
            -DGGML_SSE42=OFF `
            -DCMAKE_BUILD_TYPE=Release

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed (exit $LASTEXITCODE)"
          }

          $global:LASTEXITCODE = 0
          exit 0

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --build build --config Release -j 4
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed (exit $LASTEXITCODE)"
          }

          $global:LASTEXITCODE = 0
          exit 0

      - name: Collect exes + all DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force dist | Out-Null

          Copy-Item build\bin\Release\*.exe dist\
          Copy-Item build\bin\Release\*.dll dist\

          Get-ChildItem "$env:CUDA_PATH\bin\cudart64_*.dll"   | Copy-Item -Destination dist\
          Get-ChildItem "$env:CUDA_PATH\bin\cublas64_*.dll"   | Copy-Item -Destination dist\
          Get-ChildItem "$env:CUDA_PATH\bin\cublasLt64_*.dll" | Copy-Item -Destination dist\

          Write-Host "Copying MSVC runtime DLLs (FastMTP job)..."
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath -ErrorAction SilentlyContinue
          $crtRoot = Join-Path $vsPath "VC\Redist\MSVC"
          $crtDir = Get-ChildItem -Path $crtRoot -Directory -ErrorAction SilentlyContinue |
                    Sort-Object Name -Descending |
                    ForEach-Object {
                      Get-ChildItem -Path "$($_.FullName)\x64" -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue
                    } | Select-Object -First 1
          if ($crtDir) {
            Copy-Item "$($crtDir.FullName)\*.dll" dist\ -Force
            Write-Host "  Copied MSVC CRT from: $($crtDir.FullName)"
          } else {
            foreach ($dll in @("msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")) {
              $src = "$env:WINDIR\System32\$dll"
              if (Test-Path $src) { Copy-Item $src dist\ -Force }
            }
          }

          Get-ChildItem dist | Format-Table Name,Length

          $global:LASTEXITCODE = 0
          exit 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-fastmtp-win-cuda
          path: dist/
          retention-days: 30

  # ==================================================================
  # Job 2 - UNIFIED BeeLlama
  # DFlash2 + KVarN + kv-tail + adaptive draft-max + hybrid cache
  # ==================================================================
  beellama-dflash2:
    runs-on: windows-2022
    steps:
      - name: Checkout Anbeeld/beellama.cpp (upstream llama.cpp + DFlash2 + Bee extras)
        uses: actions/checkout@v4
        with:
          repository: Anbeeld/beellama.cpp
          ref: ${{ inputs.beellama_ref }}
          fetch-depth: 0

      # ==============================================================
      # HYBRID CACHE PERFORMANCE PATCHES
      # v5.7: Dropped --3way fallback. Only clean patches applied.
      # ==============================================================
      - name: Apply hybrid cache performance patches (conditional)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Try-ApplyPatch($url, $name) {
            Write-Host "Attempting $name"

            curl.exe -L -sS -o "$name.diff" "$url" 2>&1 | Out-Null
            $curlCode = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            if ($curlCode -ne 0) {
              Write-Host "  curl failed for $name"
              Remove-Item "$name.diff" -ErrorAction SilentlyContinue
              return $false
            }

            git apply --check "$name.diff" 2>&1 | Out-Null
            $checkCode = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            if ($checkCode -ne 0) {
              Write-Host "  $name does not apply cleanly to this ref"
              Write-Host "  $name skipped (will rely on BeeLlama built-in hybrid-cache support)"
              Remove-Item "$name.diff" -ErrorAction SilentlyContinue
              return $false
            }

            git apply "$name.diff" 2>&1 | Out-Null
            $applyCode = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            if ($applyCode -eq 0) {
              Write-Host "  $name applied cleanly"
              Remove-Item "$name.diff" -ErrorAction SilentlyContinue
              return $true
            }

            Write-Host "  $name passed --check but failed to apply; skipping"
            Remove-Item "$name.diff" -ErrorAction SilentlyContinue
            Get-ChildItem -Recurse -Include *.rej,*.orig -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue

            return $false
          }

          # PATCH 1: Fix checkpoint handling for hybrid memory models (PR #24797)
          $p1 = Try-ApplyPatch "https://github.com/ggml-org/llama.cpp/pull/24797.diff" "fix_checkpoint"

          # PATCH 2: Add --cache-reuse-hybrid for mid-prompt edits (PR #29918)
          $p2 = Try-ApplyPatch "https://github.com/ggml-org/llama.cpp/pull/29918.diff" "cache_reuse_hybrid"

          # PATCH 3: Recurrent state shrink/expand for prompt cache (PR #24785)
          $p3 = Try-ApplyPatch "https://github.com/ggml-org/llama.cpp/pull/24785.diff" "recurrent_shrink"

          # PATCH 4: Add --checkpoint-every-nb for incremental checkpoints (PR #20087)
          $p4 = Try-ApplyPatch "https://github.com/ggml-org/llama.cpp/pull/20087.diff" "checkpoint_every_nb"

          $applied = ($p1, $p2, $p3, $p4 | Where-Object { $_ -eq $true } | Measure-Object).Count

          Write-Host ""
          Write-Host "Patches applied: $applied / 4"

          if ($applied -eq 0) {
            Write-Host ""
            Write-Host "No upstream patches applied. Checking for BeeLlama built-in hybrid-cache support..."

            $builtinPatterns = @(
              'cache-reuse-hybrid',
              'checkpoint-every-nb',
              'recurrent.*shrink',
              'pos_min.*attention.*cache',
              'reusable RAM snapshots',
              'transactional state restore',
              'Reworked KV cache and prompt reuse',
              'capability-aware speculative rollback'
            )

            $foundBuiltin = $false

            foreach ($pat in $builtinPatterns) {
              $hit = Get-ChildItem -Path . -Recurse -File -Include *.cpp,*.h,*.md -ErrorAction SilentlyContinue |
                     Select-String -Pattern $pat -List -ErrorAction SilentlyContinue

              if ($hit) {
                Write-Host "  BeeLlama source already contains: $pat"
                $foundBuiltin = $true
              }
            }

            if (-Not $foundBuiltin) {
              Write-Host ""
              Write-Host "Neither upstream patches nor BeeLlama built-in hybrid-cache support detected."
              Write-Host "The binary will NOT have hybrid-cache optimizations."
              Write-Host "Verify beellama_ref is set to main or a ref with built-in hybrid-cache support."
              exit 1
            }

            Write-Host ""
            Write-Host "BeeLlama built-in hybrid-cache support will be used."
          }

          Write-Host ""
          Write-Host "Hybrid cache step complete (applied=$applied/4)"

          $global:LASTEXITCODE = 0
          exit 0

      - name: Verify source contains required speculative features
        shell: pwsh
        run: |
          $requiredPatterns = @(
            'draft-dflash',
            'ngram-map-k4v',
            'kvarn',
            'kv-tail-tokens',
            'kv-tail-type',
            'spec-dm-controller'
          )

          $sourceFound = $true

          foreach ($pattern in $requiredPatterns) {
            $found = Get-ChildItem -Path . -Recurse -File -Include *.cpp,*.h,*.c,*.hpp -ErrorAction SilentlyContinue |
                     Select-String -Pattern $pattern -List -ErrorAction SilentlyContinue

            if (-Not $found) {
              Write-Host "ERROR: Required pattern '$pattern' not found in source code"
              $sourceFound = $false
            } else {
              Write-Host "Found pattern: $pattern"
            }
          }

          if (-Not $sourceFound) {
            Write-Host "Source code verification failed - required features missing"
            exit 1
          }

          Write-Host "All required speculative features present in source code"
          exit 0

      - name: Install CUDA Toolkit (full default install)
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: ${{ inputs.cuda }}
          method: network

      - name: Register CUDA toolset with MSVC (fallback copy)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if ($LASTEXITCODE -ne 0) {
            throw "vswhere failed (exit $LASTEXITCODE)"
          }

          $dst = Join-Path $vs "MSBuild\Microsoft\VC\v170\BuildCustomizations"
          $src = "$env:CUDA_PATH\extras\visual_studio_integration\MSBuildExtensions"

          if (Test-Path $src) {
            New-Item -ItemType Directory -Force $dst | Out-Null
            Copy-Item "$src\*" $dst -Force
            Write-Host "CUDA MSBuild props copied to $dst"
          } else {
            Write-Host "MSBuildExtensions not at $src - integration likely registered already"
          }

          $global:LASTEXITCODE = 0
          exit 0

      # ==============================================================
      # Configure BeeLlama
      # BUILD_SHARED_LIBS=OFF forces static build.
      # LLAMA_CURL=OFF removes libcurl.dll dependency.
      # v5.9: static CRT (/MT), OpenMP off, curl hard-disabled.
      # ==============================================================
      - name: Configure (BeeLlama - CUDA FlashAttention incl. KVarN kernels)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake -S . -B build `
            -DGGML_CUDA=ON `
            -DGGML_CUDA_FA=ON `
            -DGGML_CUDA_FA_ALL_QUANTS=${{ inputs.fa_all_quants }} `
            -DGGML_CUDA_KVARN=ON `
            -DGGML_SPECULATIVE=ON `
            -DBUILD_SHARED_LIBS=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_EXAMPLES=ON `
            -DLLAMA_CURL=OFF `
            -DCMAKE_DISABLE_FIND_PACKAGE_CURL=ON `
            -DGGML_OPENMP=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_CUDA_ARCHITECTURES=${{ inputs.cuda_arch }} `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX=OFF `
            -DGGML_AVX2=OFF `
            -DGGML_FMA=OFF `
            -DGGML_F16C=OFF `
            -DGGML_BMI2=OFF `
            -DGGML_SSE42=OFF `
            -DCMAKE_BUILD_TYPE=Release

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed (exit $LASTEXITCODE)"
          }

          Write-Host ""
          Write-Host "--- Pre-flight: checking for unknown CMake vars ---"
          Write-Host "If GGML_CUDA_KVARN / GGML_SPECULATIVE appear as"
          Write-Host "'Manually-specified variables were not used', they do NOT"
          Write-Host "exist at this ref and the binary will lack those features."

          cmake -S . -B build -L 2>&1 |
            Select-String -Pattern "GGML_CUDA_KVARN|GGML_SPECULATIVE|Manually-specified" |
            ForEach-Object { Write-Host $_ }

          $global:LASTEXITCODE = 0
          exit 0

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --build build --config Release -j 4
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed (exit $LASTEXITCODE)"
          }

          $global:LASTEXITCODE = 0
          exit 0

      # ==============================================================
      # Verify build artifacts
      # ==============================================================
      - name: Verify build artifacts (find real llama-server.exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "--- All llama-server.exe on disk ---"
          Get-ChildItem -Recurse -Filter "llama-server.exe" -ErrorAction SilentlyContinue |
            Select-Object FullName, @{N='MB';E={[math]::Round($_.Length/1MB,2)}} |
            Format-Table -AutoSize | Out-String | Write-Host

          $real = Get-ChildItem -Recurse -Filter "llama-server.exe" -ErrorAction SilentlyContinue |
                  Where-Object { $_.Length -gt 1MB } |
                  Select-Object -First 1

          if (-not $real) {
            Write-Host "No llama-server.exe larger than 1 MB found."
            Write-Host "Possible causes:"
            Write-Host "  - BUILD_SHARED_LIBS=ON (produces launcher stub, not real binary)"
            Write-Host "  - Silent link failure (check Build step output)"
            Write-Host "  - Wrong ref (selected ref may predate required CMake flags)"
            exit 1
          }

          Write-Host "Real binary: $($real.FullName) ($([math]::Round($real.Length/1MB,2)) MB)"
          "LLAMA_SERVER_PATH=$($real.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          exit 0

      # ==============================================================
      # Collect exes + all DLLs
      # ==============================================================
      - name: Collect exes + all DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force dist | Out-Null

          $binDir = Split-Path "$env:LLAMA_SERVER_PATH"
          Write-Host "Primary copy from: $binDir"

          Copy-Item "$binDir\*.exe" dist\ -Force -ErrorAction SilentlyContinue
          Copy-Item "$binDir\*.dll" dist\ -Force -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Recursive sweep of build folder for Release .exe/.dll files..."

          $releaseFiles = Get-ChildItem -Path build -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in ".exe", ".dll" -and
              $_.FullName -match '\\Release\\'
            }

          if (-not $releaseFiles) {
            Write-Host "  No .exe/.dll found under build in Release folders."
            Write-Host "  Build tree preview (first 100 entries):"
            Get-ChildItem -Path build -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 100 FullName, Length | Format-Table -AutoSize
          } else {
            foreach ($file in $releaseFiles) {
              $dest = Join-Path "dist" $file.Name

              if (-Not (Test-Path $dest)) {
                Copy-Item -Path $file.FullName -Destination $dest -Force
                Write-Host "  Copied: $($file.Name)  ($([math]::Round($file.Length/1MB,2)) MB)"
              }
            }
          }

          Write-Host ""
          Write-Host "Copying CUDA runtime DLLs (broad sweep)..."
          Get-ChildItem "$env:CUDA_PATH\bin\*.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "^(cudart|cublas|cublasLt|nvrtc|nvJitLink|nvToolsExt)" } |
            ForEach-Object {
              Copy-Item $_.FullName dist\ -Force
              Write-Host "  Copied: $($_.Name)"
            }

          Write-Host ""
          Write-Host "--- Final dist contents (sorted) ---"
          Get-ChildItem dist | Sort-Object Name |
            Format-Table Name, @{N='MB';E={[math]::Round($_.Length/1MB,3)}} -AutoSize

          if (-Not (Test-Path "dist\llama-server.exe")) {
            Write-Host "llama-server.exe missing from dist after collection"
            exit 1
          }

          exit 0

      # ==============================================================
      # Copy runtime dependencies
      # v5.8: copies MSVC CRT DLLs from VS Redist with System32 fallback
      # so the downloaded artifact is self-contained on the user's
      # Windows machine. Does NOT execute anything - pure file copy.
      # ==============================================================
      - name: Copy runtime dependencies (MSVC CRT + System32 fallback)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $criticalDlls = @(
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "msvcp140_atomic_wait.dll",
            "msvcp140_codecvt_ids.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "concrt140.dll",
            "vcomp140.dll"
          )
          $copied = @{}

          Write-Host "Searching VS Redist for MSVC runtime DLLs..."
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath -ErrorAction SilentlyContinue
          if ($vsPath) {
            $redistRoot = Join-Path $vsPath "VC\Redist\MSVC"
            if (Test-Path $redistRoot) {
              $crtDirs = Get-ChildItem -Path $redistRoot -Directory -ErrorAction SilentlyContinue |
                         Sort-Object Name -Descending |
                         ForEach-Object {
                           Get-ChildItem -Path (Join-Path $_.FullName "x64") -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue
                         }
              foreach ($crtDir in $crtDirs) {
                foreach ($dll in $criticalDlls) {
                  if ($copied.ContainsKey($dll)) { continue }
                  $src = Join-Path $crtDir.FullName $dll
                  if (Test-Path $src) {
                    Copy-Item $src dist\ -Force
                    Write-Host "  Copied $dll  (from VS Redist)"
                    $copied[$dll] = $true
                  }
                }
              }
            }
          }

          Write-Host ""
          Write-Host "Filling any gaps from System32..."
          foreach ($dll in $criticalDlls) {
            if ($copied.ContainsKey($dll)) { continue }
            $src = Join-Path "$env:WINDIR\System32" $dll
            if (Test-Path $src) {
              Copy-Item $src dist\ -Force
              Write-Host "  Copied $dll  (from System32)"
              $copied[$dll] = $true
            }
          }

          Write-Host ""
          Write-Host "--- Runtime dependency summary ---"
          $missingCritical = @()
          foreach ($dll in @("msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")) {
            if ($copied.ContainsKey($dll)) {
              Write-Host "  OK: $dll"
            } else {
              Write-Host "  MISSING: $dll"
              $missingCritical += $dll
            }
          }

          if ($missingCritical.Count -gt 0) {
            Write-Host ""
            Write-Host "WARNING: Critical MSVC runtime DLLs still missing: $($missingCritical -join ', ')"
            Write-Host "  The user's machine may already have these installed via the VC++ Redistributable."
          } else {
            Write-Host ""
            Write-Host "All critical MSVC runtime DLLs present in dist\"
          }

          exit 0

      # ==============================================================
      # v5.10 NEW STEP: Verify binary contains required feature strings
      # --------------------------------------------------------------
      # REPLACES the previous "Smoke-test capability surface" step and
      # the "Debug DLL dependencies (dumpbin)" step.
      #
      # RATIONALE: GitHub-hosted windows-2022 runners do NOT have an
      # NVIDIA GPU and do NOT have the NVIDIA driver DLLs. Executing a
      # CUDA-enabled llama-server.exe on such a runner is unreliable by
      # design - even `--help` goes through the DLL loader and can fail
      # with 0xC0000135. Every previous iteration tried to work around
      # this with dumpbin resolvers, nvcuda fallbacks, MSVC CRT copies,
      # etc. Those reduce the probability of failure but cannot
      # eliminate it. The FastMTP job in this same workflow NEVER
      # executed the binary and NEVER failed - that is the correct
      # pattern.
      #
      # This step verifies the required feature strings are PRESENT in
      # the compiled binary via `findstr` (a pure file scan). It does
      # NOT execute the binary, does NOT load DLLs, and does NOT
      # require a GPU. It catches every failure mode that CI can
      # actually catch: CMake flags silently ignored, wrong ref,
      # truncated link, missing speculative code.
      #
      # Runtime issues (kernel crashes, driver incompatibilities,
      # inference bugs) are the user's to discover on their own GPU
      # machine - the CI runner is the wrong place to test them.
      # ==============================================================
      - name: Verify binary contains required feature strings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $exe = "dist\llama-server.exe"
          if (-Not (Test-Path $exe)) {
            Write-Host "ERROR: $exe not found"
            Get-ChildItem dist -ErrorAction SilentlyContinue | Format-Table Name, Length -AutoSize
            exit 1
          }

          $exeInfo = Get-Item $exe
          Write-Host "Binary: $($exeInfo.FullName)"
          Write-Host "Size:   $($exeInfo.Length) bytes ($([math]::Round($exeInfo.Length/1MB,2)) MB)"
          Write-Host ""

          if ($exeInfo.Length -lt 50MB) {
            Write-Host "ERROR: Binary is only $([math]::Round($exeInfo.Length/1MB,2)) MB."
            Write-Host "       A real CUDA llama-server.exe is several hundred MB."
            Write-Host "       This suggests a launcher stub or failed link."
            exit 1
          }

          # Required feature strings that MUST appear in the compiled binary.
          # These are used in help text, flag parsing, and error messages.
          $requiredFeatures = @(
            'draft-dflash',
            'ngram-map-k4v',
            'kvarn',
            'kv-tail-tokens',
            'kv-tail-type',
            'spec-dm-controller'
          )

          # Optional feature strings (hybrid cache). Present only if the
          # corresponding upstream patch applied cleanly OR BeeLlama's
          # built-in implementation exposes the flag name. Informational.
          $optionalFeatures = @(
            'cache-reuse-hybrid',
            'checkpoint-every-nb'
          )

          Write-Host "--- Hard requirements (binary string scan) ---"
          $missing = @()
          foreach ($needle in $requiredFeatures) {
            findstr /M /C:"$needle" $exe 2>&1 | Out-Null
            $found = ($LASTEXITCODE -eq 0)
            $global:LASTEXITCODE = 0
            if ($found) {
              Write-Host "OK:      $needle"
            } else {
              Write-Host "MISSING: $needle"
              $missing += $needle
            }
          }

          Write-Host ""
          Write-Host "--- Optional (hybrid cache; informational) ---"
          foreach ($needle in $optionalFeatures) {
            findstr /M /C:"$needle" $exe 2>&1 | Out-Null
            $found = ($LASTEXITCODE -eq 0)
            $global:LASTEXITCODE = 0
            if ($found) {
              Write-Host "Present: $needle"
            } else {
              Write-Host "Absent:  $needle  (built-in hybrid-cache behavior still active)"
            }
          }

          Write-Host ""
          Write-Host "=== Verification Summary ==="
          Write-Host "Required found:   $($requiredFeatures.Count - $missing.Count) / $($requiredFeatures.Count)"
          Write-Host "Required missing: $($missing.Count)"

          if ($missing.Count -gt 0) {
            Write-Host ""
            Write-Host "FAILED: The following features are not present in the binary:"
            $missing | ForEach-Object { Write-Host "  - $_" }
            Write-Host ""
            Write-Host "Most likely causes:"
            Write-Host "  1. Wrong beellama_ref (must be a ref that supports these flags)"
            Write-Host "  2. CMake flags silently ignored (check Pre-flight output)"
            Write-Host "  3. Wrong CMake target built (check Build step output)"
            exit 1
          }

          Write-Host ""
          Write-Host "All required feature strings present in the binary."
          Write-Host "The artifact is ready for download and testing on a GPU machine."
          exit 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-beellama-dflash2-win-cuda
          path: dist/
          retention-days: 30