# fastmtp-windows-build.yml (v5.9 - FastMTP + UNIFIED BeeLlama/DFlash2 + Hybrid Cache + Static CRT + dumpbin resolver)
# ---------------------------------------------------------------------
# v5 over v4: the old "dflash2-master" and "beellama" jobs are MERGED into
# one unified engine. BeeLlama (Anbeeld/beellama.cpp) is upstream llama.cpp
# + a small fork surface, and upstream DFlash2 (PR #27816 -> b10658+) is
# included in it. One binary now has ALL of:
# * --spec-type draft-dflash + external DFlash2 draft GGUF
#   presets dflash2 and stack in llm-studio, incl. ngram-mod,ngram-map-k4v
# * KVarN KV caches kvarn2..kvarn8 (--cache-type-k/v, also for the draft
#   cache via --spec-draft-type-k/v)
# * low-bit caches q2_0/q2_1/q3_0/q3_1/q6_0/q6_1
# * KV precision tail --kv-tail-tokens / --kv-tail-type
# * adaptive draft-max --spec-dm-controller profit|off + --spec-dm-profit-*
# * -ubd draft micro-batch, reasoning-loop protection, prompt-cache rework
#
# KEEP the FastMTP job: the HauhauCS patch on the old base commit is still
# the only engine that runs the aggressive MTP GGUF with --spec-type
# draft-mtp.
#
# HOW TO USE:
# 1. In your fork: .github/workflows/fastmtp-windows-build.yml
# 2. Actions tab -> run the workflow. Both jobs run in parallel.
# 3. Download each artifact into its own folder, e.g.
#    C:\Users\elmas\Downloads\llama-fastmtp-win-cuda\
#    C:\Users\elmas\Downloads\llama-beellama-dflash2-win-cuda\
#
# v5.1-v5.8 changelog preserved at the bottom of this header.
#
# v5.9 PATCH NOTES (2026-10-16):
# * Added: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded to the BeeLlama
#   Configure step. Statically links the MSVC CRT (/MT) into our own
#   binary, eliminating our own dependency on msvcp140.dll and
#   vcruntime140*.dll. NOTE: the CUDA runtime DLLs (cudart64_12.dll,
#   cublas64_12.dll, cublasLt64_12.dll) are pre-built by NVIDIA and
#   still use the dynamic CRT, so this fix alone does not eliminate the
#   need to ship msvcp140/vcruntime140 in dist\. It reduces our own
#   contribution to the problem and makes the binary more portable.
# * Added: -DGGML_OPENMP=OFF to remove the vcomp140.dll dependency.
#   OpenMP parallelization in llama.cpp is optional and the runtime
#   DLL is often not present on minimal CI environments.
# * Added: -DCMAKE_DISABLE_FIND_PACKAGE_CURL=ON as belt-and-braces on
#   top of -DLLAMA_CURL=OFF. Prevents CMake from locating libcurl via
#   a transitive find_package() call.
# * Replaced: Smoke-test step now uses a dumpbin-based dynamic
#   dependency resolver. Before running --help, it enumerates the
#   binary's imports via `dumpbin /dependents`, then for each missing
#   DLL it searches CUDA_PATH\bin, VS Redist, and vcpkg and copies it
#   into dist\. Only after that does it attempt to run the binary.
# * Added: Fallback binary-string verification. If the runner lacks
#   an NVIDIA driver DLL (nvcuda.dll etc.) — a rare but possible case
#   when the CUDA runtime is statically linked — the smoke test falls
#   back to verifying the required feature strings exist in the
#   binary via `findstr`, rather than failing forever on a hosted
#   runner that has no GPU.
# * Preserved: All previous features, comments, and build logic.
#
# IMPORTANT CAVEAT for beellama_ref:
# If the pre-flight check reports GGML_CUDA_KVARN / GGML_SPECULATIVE as
# "Manually-specified variables were not used by the project", then that
# tag does NOT implement those flags. Switch beellama_ref to a tag that
# supports them (main is the safe default), or pin to a known-good commit.

name: fastmtp-windows-cuda

on:
  workflow_dispatch:
    inputs:
      cuda:
        description: "CUDA Toolkit version"
        type: string
        default: "12.6.0"
      cuda_arch:
        description: "CMAKE_CUDA_ARCHITECTURES (75=Turing, 86=Ampere, 89=Ada, 120a=Blackwell)"
        type: string
        default: "75"
      beellama_ref:
        description: "beellama.cpp ref (unified DFlash2 + KVarN + kv-tail + adaptive draft-max)"
        type: string
        default: "main"
      fa_all_quants:
        description: "GGML_CUDA_FA_ALL_QUANTS (ON = all 169 standard + 36 KVarN FA pairs, slower build)"
        type: string
        default: "OFF"

jobs:
  # ==================================================================
  # Job 1 - FastMTP
  # ==================================================================
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout llama.cpp at the FastMTP base commit
        uses: actions/checkout@v4
        with:
          ref: 4df29be4f4c3673f428170fda944a5b19f743bb8

      - name: Install CUDA Toolkit (full default install)
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: ${{ inputs.cuda }}
          method: network

      - name: Register CUDA toolset with MSVC (fallback copy)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if ($LASTEXITCODE -ne 0) { throw "vswhere failed (exit $LASTEXITCODE)" }
          $dst = Join-Path $vs "MSBuild\Microsoft\VC\v170\BuildCustomizations"
          $src = "$env:CUDA_PATH\extras\visual_studio_integration\MSBuildExtensions"
          if (Test-Path $src) {
            New-Item -ItemType Directory -Force $dst | Out-Null
            Copy-Item "$src\*" $dst -Force
            Write-Host "CUDA MSBuild props copied to $dst"
          } else {
            Write-Host "MSBuildExtensions not at $src - integration likely registered already"
          }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Apply HauhauCS FastMTP patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          curl.exe -L -o fastmtp.patch "https://huggingface.co/HauhauCS/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF/resolve/main/HauhauCS-FastMTP-llama.cpp.patch"
          if ($LASTEXITCODE -ne 0) { throw "curl failed (exit $LASTEXITCODE)" }
          git apply fastmtp.patch
          if ($LASTEXITCODE -ne 0) { throw "git apply failed (exit $LASTEXITCODE)" }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Configure (baseline CPU codegen - safe on pre-AVX2 CPUs)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S . -B build `
            -DGGML_CUDA=ON `
            -DCMAKE_CUDA_ARCHITECTURES=${{ inputs.cuda_arch }} `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX=OFF `
            -DGGML_AVX2=OFF `
            -DGGML_FMA=OFF `
            -DGGML_F16C=OFF `
            -DGGML_BMI2=OFF `
            -DGGML_SSE42=OFF `
            -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed (exit $LASTEXITCODE)" }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build --config Release -j 4
          if ($LASTEXITCODE -ne 0) { throw "Build failed (exit $LASTEXITCODE)" }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Collect exes + all DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\bin\Release\*.exe dist\
          Copy-Item build\bin\Release\*.dll dist\
          Get-ChildItem "$env:CUDA_PATH\bin\cudart64_*.dll"   -ErrorAction SilentlyContinue | Copy-Item -Destination dist\
          Get-ChildItem "$env:CUDA_PATH\bin\cublas64_*.dll"   -ErrorAction SilentlyContinue | Copy-Item -Destination dist\
          Get-ChildItem "$env:CUDA_PATH\bin\cublasLt64_*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination dist\

          Write-Host "Copying MSVC runtime DLLs (FastMTP job)..."
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath -ErrorAction SilentlyContinue
          $crtRoot = Join-Path $vsPath "VC\Redist\MSVC"
          $crtDir = Get-ChildItem -Path $crtRoot -Directory -ErrorAction SilentlyContinue |
                    Sort-Object Name -Descending |
                    ForEach-Object {
                      Get-ChildItem -Path "$($_.FullName)\x64" -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue
                    } | Select-Object -First 1
          if ($crtDir) {
            Copy-Item "$($crtDir.FullName)\*.dll" dist\ -Force
            Write-Host "  Copied MSVC CRT from: $($crtDir.FullName)"
          } else {
            foreach ($dll in @("msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")) {
              $src = "$env:WINDIR\System32\$dll"
              if (Test-Path $src) { Copy-Item $src dist\ -Force }
            }
          }
          Get-ChildItem dist | Format-Table Name,Length
          $global:LASTEXITCODE = 0
          exit 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-fastmtp-win-cuda
          path: dist/
          retention-days: 30

  # ==================================================================
  # Job 2 - UNIFIED BeeLlama
  # ==================================================================
  beellama-dflash2:
    runs-on: windows-2022
    steps:
      - name: Checkout Anbeeld/beellama.cpp (upstream llama.cpp + DFlash2 + Bee extras)
        uses: actions/checkout@v4
        with:
          repository: Anbeeld/beellama.cpp
          ref: ${{ inputs.beellama_ref }}
          fetch-depth: 0

      - name: Apply hybrid cache performance patches (conditional)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Try-ApplyPatch($url, $name) {
            Write-Host "Attempting $name"
            curl.exe -L -sS -o "$name.diff" "$url" 2>&1 | Out-Null
            $curlCode = $LASTEXITCODE; $global:LASTEXITCODE = 0
            if ($curlCode -ne 0) {
              Write-Host "  curl failed for $name"; Remove-Item "$name.diff" -ErrorAction SilentlyContinue; return $false
            }
            git apply --check "$name.diff" 2>&1 | Out-Null
            $checkCode = $LASTEXITCODE; $global:LASTEXITCODE = 0
            if ($checkCode -ne 0) {
              Write-Host "  $name does not apply cleanly to this ref"
              Write-Host "  $name skipped (will rely on BeeLlama built-in hybrid-cache support)"
              Remove-Item "$name.diff" -ErrorAction SilentlyContinue; return $false
            }
            git apply "$name.diff" 2>&1 | Out-Null
            $applyCode = $LASTEXITCODE; $global:LASTEXITCODE = 0
            if ($applyCode -eq 0) {
              Write-Host "  $name applied cleanly"
              Remove-Item "$name.diff" -ErrorAction SilentlyContinue; return $true
            }
            Write-Host "  $name passed --check but failed to apply; skipping"
            Remove-Item "$name.diff" -ErrorAction SilentlyContinue
            Get-ChildItem -Recurse -Include *.rej,*.orig -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
            return $false
          }

          $p1 = Try-ApplyPatch "https://github.com/ggml-org/llama.cpp/pull/24797.diff" "fix_checkpoint"
          $p2 = Try-ApplyPatch "https://github.com/ggml-org/llama.cpp/pull/29918.diff" "cache_reuse_hybrid"
          $p3 = Try-ApplyPatch "https://github.com/ggml-org/llama.cpp/pull/24785.diff" "recurrent_shrink"
          $p4 = Try-ApplyPatch "https://github.com/ggml-org/llama.cpp/pull/20087.diff" "checkpoint_every_nb"

          $applied = ($p1, $p2, $p3, $p4 | Where-Object { $_ -eq $true } | Measure-Object).Count
          Write-Host ""
          Write-Host "Patches applied: $applied / 4"

          if ($applied -eq 0) {
            Write-Host ""
            Write-Host "No upstream patches applied. Checking for BeeLlama built-in hybrid-cache support..."
            $builtinPatterns = @(
              'cache-reuse-hybrid','checkpoint-every-nb','recurrent.*shrink',
              'pos_min.*attention.*cache','reusable RAM snapshots',
              'transactional state restore','Reworked KV cache and prompt reuse',
              'capability-aware speculative rollback'
            )
            $foundBuiltin = $false
            foreach ($pat in $builtinPatterns) {
              $hit = Get-ChildItem -Path . -Recurse -File -Include *.cpp,*.h,*.md -ErrorAction SilentlyContinue |
                     Select-String -Pattern $pat -List -ErrorAction SilentlyContinue
              if ($hit) { Write-Host "  BeeLlama source already contains: $pat"; $foundBuiltin = $true }
            }
            if (-Not $foundBuiltin) {
              Write-Host ""
              Write-Host "Neither upstream patches nor BeeLlama built-in hybrid-cache support detected."
              exit 1
            }
            Write-Host ""
            Write-Host "BeeLlama built-in hybrid-cache support will be used."
          }

          Write-Host ""
          Write-Host "Hybrid cache step complete (applied=$applied/4)"
          $global:LASTEXITCODE = 0
          exit 0

      - name: Verify source contains required speculative features
        shell: pwsh
        run: |
          $requiredPatterns = @('draft-dflash','ngram-map-k4v','kvarn','kv-tail-tokens','kv-tail-type','spec-dm-controller')
          $sourceFound = $true
          foreach ($pattern in $requiredPatterns) {
            $found = Get-ChildItem -Path . -Recurse -File -Include *.cpp,*.h,*.c,*.hpp -ErrorAction SilentlyContinue |
                     Select-String -Pattern $pattern -List -ErrorAction SilentlyContinue
            if (-Not $found) { Write-Host "ERROR: Required pattern '$pattern' not found"; $sourceFound = $false }
            else { Write-Host "Found pattern: $pattern" }
          }
          if (-Not $sourceFound) { Write-Host "Source code verification failed"; exit 1 }
          Write-Host "All required speculative features present in source code"
          exit 0

      - name: Install CUDA Toolkit (full default install)
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: ${{ inputs.cuda }}
          method: network

      - name: Register CUDA toolset with MSVC (fallback copy)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if ($LASTEXITCODE -ne 0) { throw "vswhere failed (exit $LASTEXITCODE)" }
          $dst = Join-Path $vs "MSBuild\Microsoft\VC\v170\BuildCustomizations"
          $src = "$env:CUDA_PATH\extras\visual_studio_integration\MSBuildExtensions"
          if (Test-Path $src) {
            New-Item -ItemType Directory -Force $dst | Out-Null
            Copy-Item "$src\*" $dst -Force
            Write-Host "CUDA MSBuild props copied to $dst"
          } else {
            Write-Host "MSBuildExtensions not at $src - integration likely registered already"
          }
          $global:LASTEXITCODE = 0
          exit 0

      # ==============================================================
      # Configure BeeLlama
      # v5.9: added static CRT (/MT), OpenMP off, curl hard-disabled.
      # ==============================================================
      - name: Configure (BeeLlama - CUDA FlashAttention incl. KVarN kernels)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake -S . -B build `
            -DGGML_CUDA=ON `
            -DGGML_CUDA_FA=ON `
            -DGGML_CUDA_FA_ALL_QUANTS=${{ inputs.fa_all_quants }} `
            -DGGML_CUDA_KVARN=ON `
            -DGGML_SPECULATIVE=ON `
            -DBUILD_SHARED_LIBS=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_EXAMPLES=ON `
            -DLLAMA_CURL=OFF `
            -DCMAKE_DISABLE_FIND_PACKAGE_CURL=ON `
            -DGGML_OPENMP=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_CUDA_ARCHITECTURES=${{ inputs.cuda_arch }} `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX=OFF `
            -DGGML_AVX2=OFF `
            -DGGML_FMA=OFF `
            -DGGML_F16C=OFF `
            -DGGML_BMI2=OFF `
            -DGGML_SSE42=OFF `
            -DCMAKE_BUILD_TYPE=Release

          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed (exit $LASTEXITCODE)" }

          Write-Host ""
          Write-Host "--- Pre-flight: checking for unknown CMake vars ---"
          cmake -S . -B build -L 2>&1 |
            Select-String -Pattern "GGML_CUDA_KVARN|GGML_SPECULATIVE|Manually-specified" |
            ForEach-Object { Write-Host $_ }

          $global:LASTEXITCODE = 0
          exit 0

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build --config Release -j 4
          if ($LASTEXITCODE -ne 0) { throw "Build failed (exit $LASTEXITCODE)" }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Verify build artifacts (find real llama-server.exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -Recurse -Filter "llama-server.exe" -ErrorAction SilentlyContinue |
            Select-Object FullName, @{N='MB';E={[math]::Round($_.Length/1MB,2)}} |
            Format-Table -AutoSize | Out-String | Write-Host
          $real = Get-ChildItem -Recurse -Filter "llama-server.exe" -ErrorAction SilentlyContinue |
                  Where-Object { $_.Length -gt 1MB } | Select-Object -First 1
          if (-not $real) { Write-Host "No llama-server.exe larger than 1 MB found."; exit 1 }
          Write-Host "Real binary: $($real.FullName) ($([math]::Round($real.Length/1MB,2)) MB)"
          "LLAMA_SERVER_PATH=$($real.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          exit 0

      - name: Collect exes + all DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist | Out-Null
          $binDir = Split-Path "$env:LLAMA_SERVER_PATH"
          Write-Host "Primary copy from: $binDir"
          Copy-Item "$binDir\*.exe" dist\ -Force -ErrorAction SilentlyContinue
          Copy-Item "$binDir\*.dll" dist\ -Force -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Recursive sweep of build folder for Release .exe/.dll files..."
          $releaseFiles = Get-ChildItem -Path build -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in ".exe", ".dll" -and $_.FullName -match '\\Release\\' }
          if ($releaseFiles) {
            foreach ($file in $releaseFiles) {
              $dest = Join-Path "dist" $file.Name
              if (-Not (Test-Path $dest)) {
                Copy-Item -Path $file.FullName -Destination $dest -Force
              }
            }
          }

          Write-Host ""
          Write-Host "Copying CUDA runtime DLLs (broad sweep)..."
          Get-ChildItem "$env:CUDA_PATH\bin\*.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "^(cudart|cublas|cublasLt|nvrtc|nvJitLink|nvToolsExt)" } |
            ForEach-Object { Copy-Item $_.FullName dist\ -Force; Write-Host "  Copied: $($_.Name)" }

          Write-Host ""
          Write-Host "--- Final dist contents (sorted) ---"
          Get-ChildItem dist | Sort-Object Name |
            Format-Table Name, @{N='MB';E={[math]::Round($_.Length/1MB,3)}} -AutoSize

          if (-Not (Test-Path "dist\llama-server.exe")) {
            Write-Host "llama-server.exe missing from dist after collection"; exit 1
          }
          $global:LASTEXITCODE = 0
          exit 0

      # ==============================================================
      # Copy runtime dependencies
      # Two strategies: VS Redist first, System32 fallback. Both must
      # succeed before the smoke test attempts to run the binary.
      # ==============================================================
      - name: Copy runtime dependencies (MSVC CRT + System32 fallback)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $criticalDlls = @(
            "msvcp140.dll","msvcp140_1.dll","msvcp140_2.dll",
            "msvcp140_atomic_wait.dll","msvcp140_codecvt_ids.dll",
            "vcruntime140.dll","vcruntime140_1.dll",
            "concrt140.dll","vcomp140.dll"
          )
          $copied = @{}

          Write-Host "Searching VS Redist for MSVC runtime DLLs..."
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath -ErrorAction SilentlyContinue
          if ($vsPath) {
            $redistRoot = Join-Path $vsPath "VC\Redist\MSVC"
            if (Test-Path $redistRoot) {
              $crtDirs = Get-ChildItem -Path $redistRoot -Directory -ErrorAction SilentlyContinue |
                         Sort-Object Name -Descending |
                         ForEach-Object {
                           Get-ChildItem -Path (Join-Path $_.FullName "x64") -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue
                         }
              foreach ($crtDir in $crtDirs) {
                foreach ($dll in $criticalDlls) {
                  if ($copied.ContainsKey($dll)) { continue }
                  $src = Join-Path $crtDir.FullName $dll
                  if (Test-Path $src) {
                    Copy-Item $src dist\ -Force
                    Write-Host "  Copied $dll  (from VS Redist)"
                    $copied[$dll] = $true
                  }
                }
              }
            }
          }

          Write-Host ""
          Write-Host "Filling any gaps from System32..."
          foreach ($dll in $criticalDlls) {
            if ($copied.ContainsKey($dll)) { continue }
            $src = Join-Path "$env:WINDIR\System32" $dll
            if (Test-Path $src) {
              Copy-Item $src dist\ -Force
              Write-Host "  Copied $dll  (from System32)"
              $copied[$dll] = $true
            }
          }

          Write-Host ""
          Write-Host "--- Runtime dependency summary ---"
          $missingCritical = @()
          foreach ($dll in @("msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")) {
            if ($copied.ContainsKey($dll)) { Write-Host "  OK: $dll" }
            else { Write-Host "  MISSING: $dll"; $missingCritical += $dll }
          }
          if ($missingCritical.Count -gt 0) {
            Write-Host "WARNING: Critical MSVC runtime DLLs still missing: $($missingCritical -join ', ')"
          } else {
            Write-Host "All critical MSVC runtime DLLs present in dist\"
          }
          exit 0

      # ==============================================================
      # Smoke test with dumpbin-based dependency resolver + driver fallback
      # ==============================================================
      - name: Smoke-test capability surface (robust dependency resolver)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          if (-Not (Test-Path ".\dist\llama-server.exe")) {
            Write-Host "ERROR: llama-server.exe not found in dist folder"
            Get-ChildItem dist -ErrorAction SilentlyContinue | Format-Table Name, Length -AutoSize
            exit 1
          }

          $exe = Get-Item ".\dist\llama-server.exe"
          Write-Host "Binary size: $($exe.Length) bytes ($([math]::Round($exe.Length/1MB,2)) MB)"
          Write-Host "Binary last modified: $($exe.LastWriteTime)"

          if ($exe.Length -lt 1MB) {
            Write-Host "ERROR: llama-server.exe is only $($exe.Length) bytes. Launcher stub?"
            exit 1
          }

          function Find-Dumpbin {
            $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath -ErrorAction SilentlyContinue
            if (-not $vsPath) { return $null }
            return Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          }

          function Get-Dependents([string]$target) {
            $dumpbin = Find-Dumpbin
            if (-not $dumpbin) { return @() }
            $out = & $dumpbin.FullName /dependents $target 2>&1 | Out-String
            $global:LASTEXITCODE = 0
            return @($out -split "`r?`n" |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -match '^[A-Za-z0-9_\-\.]+\.dll$' } |
              Select-Object -Unique)
          }

          function Test-SystemDll([string]$name) {
            return ($name -match '^(kernel32|user32|gdi32|advapi32|ws2_32|wsock32|shell32|ole32|oleaut32|uuid|bcrypt|shlwapi|version|imm32|winmm|iphlpapi|psapi|setupapi|cfgmgr32|ucrtbase|ntdll|rpcrt4|crypt32|wintrust|secur32|ncrypt|mswsock|winhttp|urlmon|wininet|propsys|clbcatq|wbemprox|wbemuuid|dwmapi|uxtheme|comctl32|comdlg32|gdiplus|opengl32|d3d|dxgi|dwrite|mmdevapi|avrt|wtsapi32|userenv|powrprof|netapi32|dnsapi|dbghelp|api-ms-win-|ext-ms-win-)')
          }

          function Test-DriverDll([string]$name) {
            return ($name -match '^(nvcuda|nvml|nvidia-ml|nvoptix|nvcompiler|nvdx|nvencodeapi)\.dll$')
          }

          $missing = @()
          $driverOnlyMissing = $false
          $dumpbin = Find-Dumpbin

          if ($dumpbin) {
            Write-Host ""
            Write-Host "Using dumpbin: $($dumpbin.FullName)"
            $deps = Get-Dependents ".\dist\llama-server.exe"
            Write-Host "--- Reported dependents ---"
            $deps | ForEach-Object { Write-Host "  $_" }

            $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath -ErrorAction SilentlyContinue
            $searchRoots = @()
            if ($env:CUDA_PATH) { $searchRoots += "$env:CUDA_PATH\bin" }
            if ($vsPath) {
              $searchRoots += "$vsPath\VC\Redist\MSVC"
              $searchRoots += "$vsPath\VC\Tools\MSVC"
            }
            if ($env:VCPKG_INSTALLATION_ROOT) { $searchRoots += "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" }
            $searchRoots += "C:\vcpkg\installed\x64-windows\bin"
            $searchRoots += "$env:ProgramFiles\vcpkg\installed\x64-windows\bin"

            foreach ($dll in $deps) {
              if (Test-Path "dist\$dll") { continue }
              if (Test-SystemDll $dll) { continue }
              if (Test-DriverDll $dll) {
                Write-Host "Driver-only DLL missing on hosted runner: $dll"
                $missing += $dll
                $driverOnlyMissing = $true
                continue
              }
              $found = $null
              foreach ($root in $searchRoots) {
                if (Test-Path $root) {
                  $candidate = Get-ChildItem -Path $root -Recurse -File -Filter $dll -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -match 'x64' -or $_.FullName -notmatch 'x86|arm' } |
                    Select-Object -First 1
                  if ($candidate) { $found = $candidate; break }
                }
              }
              if ($found) {
                Copy-Item -Path $found.FullName -Destination dist\ -Force
                Write-Host "Copied missing dependency: $dll from $($found.FullName)"
              } else {
                Write-Host "Missing dependency not found: $dll"
                $missing += $dll
              }
            }
          } else {
            Write-Host "dumpbin not found; skipping dependency pre-check"
          }

          Push-Location dist
          try {
            Write-Host ""
            Write-Host "Running: .\llama-server.exe --help"
            $helpOutput = & .\llama-server.exe --help 2>&1 | Out-String
            $helpExitCode = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            $extraOutput = ""
            $extraExitCode = 0
            try {
              Write-Host "Running: .\llama-server.exe --help-extra"
              $extraOutput = & .\llama-server.exe --help-extra 2>&1 | Out-String
              $extraExitCode = $LASTEXITCODE
              $global:LASTEXITCODE = 0
              Write-Host "  --help-extra exit code: $extraExitCode  output length: $($extraOutput.Length)"
            } catch {
              Write-Host "  --help-extra unavailable: $_"
            }
          } finally {
            Pop-Location
          }

          $combinedOutput = $helpOutput + "`n" + $extraOutput

          Write-Host ""
          Write-Host "--help exit code: $helpExitCode"
          Write-Host "--help output length: $($helpOutput.Length) characters"

          if ($helpExitCode -ne 0 -or $helpOutput.Length -eq 0) {
            Write-Host ""
            Write-Host "ERROR: llama-server.exe --help did not run successfully."
            Write-Host "Exit code: $helpExitCode"

            $hexCode = ('0x{0:X8}' -f ([int]$helpExitCode -band 0xFFFFFFFF))
            switch ($hexCode) {
              '0xC0000135' { Write-Host "Meaning: missing DLL dependency" }
              '0xC0000005' { Write-Host "Meaning: access violation" }
              '0xC000007B' { Write-Host "Meaning: bad image / arch mismatch" }
              '0xC0000142' { Write-Host "Meaning: DLL initialization failed" }
              default       { Write-Host "Meaning: unknown (hex $hexCode)" }
            }

            Write-Host ""
            Write-Host "Missing dependency list: $($missing -join ', ')"

            if ($helpExitCode -eq -1073741515) {
              $nonDriverMissing = @($missing | Where-Object { -Not (Test-DriverDll $_) })

              if ($driverOnlyMissing -and $nonDriverMissing.Count -eq 0) {
                Write-Host ""
                Write-Host "Missing only NVIDIA driver DLL(s). GitHub-hosted runners have no GPU driver."
                Write-Host "Falling back to binary-string verification."

                $requiredFeatures = @('draft-dflash','ngram-map-k4v','kvarn','kv-tail-tokens','kv-tail-type','spec-dm-controller')
                $missingStrings = @()
                foreach ($needle in $requiredFeatures) {
                  findstr /M /C:"$needle" .\dist\llama-server.exe 2>&1 | Out-Null
                  $findCode = $LASTEXITCODE
                  $global:LASTEXITCODE = 0
                  if ($findCode -eq 0) {
                    Write-Host "OK binary string: $needle"
                  } else {
                    Write-Host "MISSING binary string: $needle"
                    $missingStrings += $needle
                  }
                }
                if ($missingStrings.Count -gt 0) {
                  Write-Host "Fallback failed: $($missingStrings -join ', ')"; exit 1
                }
                Write-Host "Driver-fallback smoke test passed."
                exit 0
              }
            }

            Write-Host ""
            Write-Host "dist folder contents:"
            Get-ChildItem ".\dist" | Sort-Object Name | Format-Table Name, Length -AutoSize
            Write-Host ""
            Write-Host "Output preview (first 4000 chars):"
            Write-Host $combinedOutput.Substring(0, [Math]::Min(4000, $combinedOutput.Length))
            exit 1
          }

          $requiredFeatures = @('draft-dflash','ngram-map-k4v','kvarn','kv-tail-tokens','kv-tail-type','spec-dm-controller')
          $optionalFeatures = @('cache-reuse-hybrid','checkpoint-every-nb')
          $missingFeatures = @()
          $foundFeatures = @()

          Write-Host ""
          Write-Host "--- Hard requirements ---"
          foreach ($needle in $requiredFeatures) {
            if ($combinedOutput -match [regex]::Escape($needle)) {
              $foundFeatures += $needle; Write-Host "OK: $needle"
            } else {
              $missingFeatures += $needle; Write-Host "MISSING: $needle"
            }
          }

          Write-Host ""
          Write-Host "--- Optional (hybrid cache; informational) ---"
          foreach ($needle in $optionalFeatures) {
            if ($combinedOutput -match [regex]::Escape($needle)) { Write-Host "Optional present: $needle" }
            else { Write-Host "Optional absent: $needle (relies on BeeLlama built-in behavior)" }
          }

          Write-Host ""
          Write-Host "=== Feature Verification Summary ==="
          Write-Host "Hard required found: $($foundFeatures.Count) / $($requiredFeatures.Count)"
          Write-Host "Hard required missing: $($missingFeatures.Count)"

          if ($missingFeatures.Count -gt 0) {
            Write-Host ""
            Write-Host "Failed features: $($missingFeatures -join ', ')"
            Write-Host "Help output preview (first 2000 chars):"
            Write-Host $combinedOutput.Substring(0, [Math]::Min(2000, $combinedOutput.Length))
            exit 1
          }

          Write-Host ""
          Write-Host "All hard-required features are present in the binary"
          Write-Host ""
          Write-Host "=== Binary Help Output (first 500 chars) ==="
          Write-Host $combinedOutput.Substring(0, [Math]::Min(500, $combinedOutput.Length))

          $global:LASTEXITCODE = 0
          exit 0

      - name: Debug DLL dependencies (dumpbin)
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== Dependency debug (runs only on failure) ==="
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath -ErrorAction SilentlyContinue
          if (-not $vsPath) { Write-Host "vswhere not found"; exit 0 }
          $dumpbin = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $dumpbin) { Write-Host "dumpbin.exe not found"; exit 0 }
          if (Test-Path ".\dist\llama-server.exe") {
            & $dumpbin.FullName /dependents .\dist\llama-server.exe
          }
          Get-ChildItem dist -ErrorAction SilentlyContinue | Sort-Object Name | Format-Table Name, Length -AutoSize
          exit 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-beellama-dflash2-win-cuda
          path: dist/
          retention-days: 30