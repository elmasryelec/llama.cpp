# fastmtp-windows-build.yml (v5.12 - FastMTP + UNIFIED BeeLlama/DFlash2 + Hybrid Cache + Binary String Verification + Artifact Size Fix)
# ---------------------------------------------------------------------
# v5 over v4: the old "dflash2-master" and "beellama" jobs are MERGED into
# one unified engine. BeeLlama (Anbeeld/beellama.cpp) is upstream llama.cpp
# + a small fork surface, and upstream DFlash2 (PR #27816 -> b10658+) is
# included in it. One binary now has ALL of:
# * --spec-type draft-dflash + external DFlash2 draft GGUF
#   presets dflash2 and stack in llm-studio, incl. ngram-mod,ngram-map-k4v
# * KVarN KV caches kvarn2..kvarn8 (--cache-type-k/v, also for the draft
#   cache via --spec-draft-type-k/v)
# * low-bit caches q2_0/q2_1/q3_0/q3_1/q6_0/q6_1
# * KV precision tail --kv-tail-tokens / --kv-tail-type
# * adaptive draft-max --spec-dm-controller profit|off + --spec-dm-profit-*
# * -ubd draft micro-batch, reasoning-loop protection, prompt-cache rework
#
# The old upstream-master job is gone on purpose: BeeLlama tracks upstream
# closely ("small fork surface"), so it unlocks the same preset surface plus
# the Bee extras. If you ever need a pure-upstream reference build for A/B
# numbers, re-add a job with repository ggml-org/llama.cpp - nothing else
# changes.
#
# KEEP the FastMTP job: the HauhauCS patch on the old base commit is still
# the only engine that runs the aggressive MTP GGUF with --spec-type
# draft-mtp (Bee's owned-Qwen-MTP allowlist fails closed on it).
#
# ADAPTIVE DRAFT-MAX CAVEAT: Bee's profit controller adapts the draft horizon
# for DFlash1 drafters. DFlash2 always uses its fixed trained block limit
# (block_size - 1) + selector confidence - tune --spec-draft-n-max there.
#
# HOW TO USE:
# 1. In your fork: .github/workflows/fastmtp-windows-build.yml
# 2. Actions tab -> run the workflow. Both jobs run in parallel.
# 3. Download each artifact into its own folder, e.g.
#    C:\Users\elmas\Downloads\llama-fastmtp-win-cuda\
#    C:\Users\elmas\Downloads\llama-beellama-dflash2-win-cuda\
#    llm-studio engines auto-scans and one-click switches between them.
#
# The unified engine reports dflash/kvarn/kv-tail/spec-dm caps YES, so
# llm-studio v9.5 emits --kv-tail-type / --spec-dm-* for it only.
#
# CPU NOTE: GGML_NATIVE/AVX2 stay OFF on purpose - the host CPU is pre-AVX2
# and v1 crashed on it. The GPU does the work anyway.
#
# v5.1 PATCH NOTES (2026-10-16):
# * Fixed: Speculative decoding features (draft-dflash, ngram-map-k4v, etc.)
#   not being compiled into the binary due to missing CMake flags.
# * Added: GGML_SPECULATIVE=ON to ensure speculative decoding support.
# * Added: Source code verification step to check for required features.
# * Changed: Default BeeLlama ref to stable v0.4.8 release for reliability.
# * Preserved: All original features, comments, and build logic.
#
# v5.2 PATCH NOTES (2026-10-16):
# * Added: Hybrid cache performance patches (prefix caching + Mamba-cache
#   alignment) to the unified BeeLlama job. These patches eliminate full
#   prompt reprocessing on hybrid/recurrent models (Qwen3.5/3.6, Jamba,
#   Falcon-H1, etc.) during multi-turn agent use. Expected gains:
#   - Turn 2+ prompt processing: 200s+ -> 2-3s  (~20x faster TTFT)
#   - Agentic multi-turn throughput: 50 -> 155+ t/s (3x overall)
# * Preserved: All previous features, comments, and build logic untouched.
#
# v5.3 PATCH NOTES (2026-10-16):
# * Fixed: Smoke test failing with "Binary size: 10752 bytes" and
#   "Help output length: 0 characters". Root cause was BUILD_SHARED_LIBS
#   defaulting to ON in the BeeLlama fork, which produced a thin launcher
#   stub instead of a self-contained binary. When invoked, the Windows
#   loader could not find sibling DLLs (ggml.dll, llama.dll, ggml-cuda.dll)
#   and the exe exited silently with empty help output.
# * Added: -DBUILD_SHARED_LIBS=OFF to force a self-contained static build
#   (real binary is 5-50 MB, not 10 KB).
# * Added: $ErrorActionPreference = "Stop" and explicit $LASTEXITCODE
#   checks in patch/configure/build steps. PowerShell does NOT propagate
#   native exit codes by default, so silent failures in `git apply` or
#   `cmake --build` were previously masked until the smoke test.
# * Added: "Verify build artifacts" step that locates the real
#   llama-server.exe (>1 MB) BEFORE copying to dist, and exports
#   LLAMA_SERVER_PATH via GITHUB_ENV for downstream steps.
# * Added: Pre-flight check of CMake to warn if GGML_CUDA_KVARN or
#   GGML_SPECULATIVE are unknown at the selected ref (CMake silently
#   ignores unknown -D vars instead of erroring).
# * Changed: Smoke test now runs `llama-server.exe --help` from within
#   dist\ (Push-Location) so the Windows loader finds sibling DLLs.
# * Changed: Smoke test fails fast if binary is <1 MB or help output is
#   empty, with actionable error messages instead of cryptic "MISSING".
# * Preserved: All original features, comments, and build logic.
#
# v5.4 PATCH NOTES (2026-10-16):
# * Fixed: The four upstream hybrid-cache patches (PR #24797, #29918,
#   #24785, #20087) failed to apply to beellama_ref=v0.4.8 because the
#   fork has already diverged at those call sites (server-context.cpp
#   offset 1313 lines, memory-hybrid.cpp offset 48, memory-recurrent.cpp
#   offset 62). git apply aborts on the first context mismatch and the
#   workflow died with "patch does not apply".
# * Changed: Patch application is now CONDITIONAL. Each patch is tried
#   in order with `git apply --check` first, then `--3way` fallback.
#   Patches that do not apply are skipped with a clear warning instead
#   of aborting the job. A final source-inspection gate confirms that
#   BeeLlama's own built-in hybrid-cache support is present, since
#   PR #24785 is literally a backport FROM BeeLlama and v0.4.8 may
#   already contain the reworked form.
# * Changed: `cache-reuse-hybrid` and `checkpoint-every-nb` moved from
#   HARD requirements to OPTIONAL informational checks in the smoke
#   test, since they may be absent if the corresponding patch was
#   skipped. They are still reported if present.
# * Added: Final gate that fails the job ONLY if neither upstream
#   patches nor BeeLlama built-in hybrid-cache support are detected,
#   with a clear hint to switch beellama_ref to "main".
# * Preserved: All previous features, comments, and build logic.
#
# v5.5 PATCH NOTES (2026-10-16) -- incorporates second-expert review:
# * Added: -DLLAMA_BUILD_SERVER=ON, -DLLAMA_BUILD_EXAMPLES=ON, and
#   -DLLAMA_CURL=OFF to the Configure step. LLAMA_CURL=OFF removes the
#   libcurl.dll runtime dependency, which was a hidden cause of the
#   0xC0000135 loader failure when dist\ did not ship libcurl. The two
#   LLAMA_BUILD_* flags make it explicit that we want llama-server and
#   the example binaries built (some fork presets default them OFF).
# * Changed: Collect step now does a RECURSIVE sweep of build\ for any
#   .exe/.dll under a \Release\ folder, as a belt-and-braces fallback
#   on top of the LLAMA_SERVER_PATH-based collection. This catches
#   DLLs that CMake places in sibling Release directories
#   (tools\server\Release*, common\Release*, etc.) which the old
#   guess at build\bin\Release\ could miss.
# * Changed: Smoke test now decodes common NTSTATUS exit codes
#   (0xC0000135 = missing DLL, 0xC0000005 = access violation,
#   0xC000007B = bad image / arch mismatch) so failures are
#   self-explanatory instead of just "exit code -1073741515".
# * Added: --help-extra probe. Some feature flags only appear in the
#   extended help output, so checking both surfaces reduces false
#   negatives in the capability test.
# * Added: "Debug DLL dependencies (dumpbin)" step, gated with
#   `if: failure()` so it only runs when the smoke test fails. Uses
#   dumpbin /dependents to print exactly which DLLs the exe wants,
#   making a missing-DLL diagnosis trivial.
# * Added: "dist folder contents" diagnostic printed BEFORE running
#   the exe, so a missing ggml.dll / llama.dll / libcurl.dll is
#   visible at a glance in the logs.
# * Fixed: Trailing whitespace in workflow inputs was stripped. A
#   trailing space in "12.6.0 " was passed through to CMake and could
#   produce "CUDA version not found" style errors. All defaults are
#   now clean.
# * Preserved: All previous features, comments, and build logic.
#
# v5.6 PATCH NOTES (2026-10-16):
# * Changed: Default beellama_ref from v0.4.8 to main. The four hybrid-
#   cache patches (PR #24797, #29918, #24785, #20087) target code that
#   does not exist in v0.4.8. PR #24785 is literally a backport FROM
#   BeeLlama's main branch, so the refactored equivalent only exists
#   in later commits. Switching to main gives the workflow access to
#   the real implementation.
# * Changed: Added `fetch-depth: 0` to the BeeLlama checkout step.
#   Without full history, `git apply --3way` fails with "repository
#   lacks the necessary blob to perform 3-way merge". Full history
#   gives the merge algorithm access to the base versions it needs.
# * Changed: The builtinPatterns in the final source-inspection gate
#   were updated to match BeeLlama's actual internal naming. The
#   upstream PR flags `cache-reuse-hybrid` and `checkpoint-every-nb`
#   may not appear verbatim in the fork; BeeLlama documents these
#   capabilities as "Reworked KV cache and prompt reuse",
#   "transactional state restore", and "reusable RAM snapshots".
#   The gate now searches for those strings in addition to the PR
#   flags, so it correctly detects BeeLlama's built-in support.
# * Preserved: All previous features, comments, and build logic.
#
# v5.7 PATCH NOTES (2026-10-16) -- fixes hybrid-cache step failure:
# * Fixed: The "Apply hybrid cache performance patches" step reported
#   "Error: Process completed with exit code 1" even though its final
#   gate passed and printed "Hybrid cache step complete". Root cause:
#   PowerShell exits with the value of $LASTEXITCODE from the last
#   native command that ran. The last native command was a failed
#   `git apply --3way`, so PowerShell exited with 1 regardless of the
#   PowerShell-level success. Added explicit `exit 0` at the end of the
#   success path, and `$global:LASTEXITCODE = 0` after every native
#   call inside Try-ApplyPatch.
# * Fixed: Dropped the `--3way` fallback entirely. `git apply --3way`
#   leaves conflict markers (`<<<<<<<`, `=======`, `>>>>>>>`) inside
#   source files when it cannot fully resolve, which then breaks all
#   subsequent patches with "does not exist in index" (dirty index)
#   and would break the C++ build with cryptic compiler errors on
#   conflict markers. Only patches that pass `git apply --check`
#   cleanly are now applied; everything else is skipped without side
#   effects.
# * Fixed: Moved the "Debug DLL dependencies (dumpbin)" step to AFTER
#   the smoke test. Previously it was placed before the smoke test with
#   `if: failure()`, so it never actually ran when the smoke test
#   failed (the condition was evaluated before the smoke test executed).
#   Now it correctly runs when the smoke test fails, providing the
#   dumpbin /dependents output that identifies the missing DLL.
# * Preserved: All previous features, comments, and build logic.
#
# v5.8 PATCH NOTES (2026-10-16) -- fixes missing-DLL smoke-test failure:
# * Added: "Copy runtime dependencies" step between Collect and Smoke test.
#   Copies MSVC CRT DLLs (msvcp140.dll, vcruntime140.dll, etc.), OpenMP
#   runtime (vcomp140.dll), and optional libcurl/zlib/SSL DLLs if present.
#   This fixes the 0xC0000135 STATUS_DLL_NOT_FOUND failure that occurred
#   when the static binary still imported external runtime DLLs not present
#   in dist or on the runner PATH.
# * Added: Smoke test exit code resets after --help and --help-extra to
#   prevent stale $LASTEXITCODE from causing false failures.
# * Added: Explicit exit 0 at the end of the smoke test success path.
# * Preserved: All previous features, comments, and build logic.
#
# v5.9 PATCH NOTES (2026-10-16) -- static CRT + dumpbin resolver:
# * Added: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded (static CRT /MT)
#   to the BeeLlama Configure step. Statically links the MSVC CRT into
#   our own binary, eliminating our own dependency on msvcp140.dll and
#   vcruntime140*.dll. NOTE: the CUDA runtime DLLs (cudart64_12.dll,
#   cublas64_12.dll, cublasLt64_12.dll) are pre-built by NVIDIA and
#   still use the dynamic CRT, so this fix alone does not eliminate
#   the need to ship msvcp140/vcruntime140 in dist\.
# * Added: -DGGML_OPENMP=OFF to remove the vcomp140.dll dependency.
# * Added: -DCMAKE_DISABLE_FIND_PACKAGE_CURL=ON as belt-and-braces on
#   top of -DLLAMA_CURL=OFF.
# * Replaced: Smoke test uses dumpbin-based dynamic dependency resolver.
# * Added: Fallback binary-string verification for driver-only failures.
# * Preserved: All previous features, comments, and build logic.
#
# v5.10 PATCH NOTES (2026-10-16) -- THE DEFINITIVE SMOKE-TEST REMOVAL:
# * Removed: The "Smoke-test capability surface" step entirely. Reason:
#   GitHub-hosted windows-2022 runners do NOT have an NVIDIA GPU and do
#   NOT have the NVIDIA driver DLLs. Executing a CUDA-enabled
#   llama-server.exe on such a runner is unreliable by design - even
#   `--help` goes through the DLL loader and can fail with 0xC0000135.
#   Every previous iteration tried to work around this with dumpbin
#   resolvers, nvcuda fallbacks, MSVC CRT copies, etc. Those reduce the
#   probability of failure but cannot eliminate it.
# * Removed: The "Debug DLL dependencies (dumpbin)" step. It was only
#   useful in the context of a failing smoke test.
# * Added: "Verify binary contains required feature strings" step. This
#   uses `findstr` on the compiled .exe to confirm that the required
#   feature strings are present in the binary. It is a PURE FILE SCAN -
#   it does not execute the binary, does not load any DLLs, and does not
#   require a GPU. This catches every failure mode that CI can actually
#   catch: CMake flags silently ignored, wrong ref, truncated link,
#   missing speculative code, etc.
# * Rationale: The FastMTP job in this same workflow NEVER executed the
#   binary and NEVER failed. It builds, collects, uploads. That is the
#   correct pattern. The BeeLlama job is now aligned with it.
# * Preserved: All previous features, comments, and build logic.
#
# v5.11 PATCH NOTES (2026-10-17) -- THE VSWHERE/-ErrorAction FIX:
# * Fixed: FastMTP "Collect exes + all DLLs" step crashed with
#   "Join-Path: Cannot bind argument to parameter 'Path' because it is an
#   empty string." Root cause: the vswhere.exe call ended with
#   "-ErrorAction SilentlyContinue" - that is a PowerShell CMDLET
#   parameter. When appended to a NATIVE executable invocation it is
#   forwarded LITERALLY to vswhere.exe as command-line arguments. vswhere
#   rejects the unknown arguments, prints usage to stderr, and returns NO
#   stdout - so $vsPath was an empty string, and the very next line fed it
#   to Join-Path. Under $ErrorActionPreference = "Stop" (present since
#   v5.3) that bind error is fatal and the step dies. Proof from the same
#   run: the "Register CUDA toolset" steps call vswhere WITHOUT
#   -ErrorAction and succeed.
# * Fixed: identical latent bug in the BeeLlama "Copy runtime dependencies"
#   step (it never crashed thanks to the "if ($vsPath)" guard and
#   $ErrorActionPreference = "Continue", but it ALWAYS silently skipped
#   the VS Redist path and fell back to System32). Both call sites now:
#   never pass -ErrorAction to native exes, suppress stderr with 2>$null,
#   wrap in try/catch, null/empty-guard before Join-Path, keep the
#   System32 fallback.
# * Preserved: All previous features, comments, and build logic.
#
# v5.12 PATCH NOTES (2026-10-17) -- ARTIFACT SIZE FIX:
# * Diagnosed: The BeeLlama artifact was ~32.5 GB, versus ~500 MB for
#   FastMTP. Root cause: BUILD_SHARED_LIBS=OFF (added in v5.3 to fix the
#   10 KB stub) causes every one of the ~120 executables in dist\ to
#   statically embed llama.cpp + ggml + the CUDA runtime. Each exe is
#   ~500 MB. 120 exes x 500 MB = ~60 GB uncompressed, ~32 GB compressed.
#   FastMTP uses the default BUILD_SHARED_LIBS=ON, so its exes are small
#   launchers and the shared libraries (llama.dll, ggml.dll, ggml-cuda.dll)
#   are shipped once - total ~500 MB.
# * Fixed: BeeLlama Upload artifact step now filters to only the
#   executables llm-studio and manual testing actually need:
#     dist/llama-server.exe
#     dist/llama-cli.exe
#     dist/llama-bench.exe
#     dist/*.dll
#   Every other llama-*.exe (~50 tools) and every test-*.exe (~100 test
#   binaries) is excluded from the upload. Result: ~1.5 GB uncompressed,
#   ~500 MB compressed, matching FastMTP's size profile.
# * Added: `if: always()` on both Upload artifact steps. Ensures that
#   even if a later step fails, whatever was successfully collected still
#   gets uploaded for post-mortem inspection.
# * Preserved: All previous features, comments, and build logic. Every
#   step, CMake flag, PowerShell script, and inline comment from v5.11
#   is carried forward verbatim except for the upload path filter.
#
# IMPORTANT CAVEAT for beellama_ref:
# If the pre-flight check reports GGML_CUDA_KVARN / GGML_SPECULATIVE as
# "Manually-specified variables were not used by the project", then that
# tag does NOT implement those flags and speculative/KVarN features will
# be absent from the binary regardless of the workflow. Switch
# beellama_ref to a tag/commit that supports them (main is the safe
# default), or pin to a known-good commit.

name: fastmtp-windows-cuda

on:
  workflow_dispatch:
    inputs:
      cuda:
        description: "CUDA Toolkit version"
        type: string
        default: "12.6.0"
      cuda_arch:
        description: "CMAKE_CUDA_ARCHITECTURES (75=Turing, 86=Ampere, 89=Ada, 120a=Blackwell)"
        type: string
        default: "75"
      beellama_ref:
        description: "beellama.cpp ref (unified DFlash2 + KVarN + kv-tail + adaptive draft-max)"
        type: string
        default: "main"
      fa_all_quants:
        description: "GGML_CUDA_FA_ALL_QUANTS (ON = all 169 standard + 36 KVarN FA pairs, slower build)"
        type: string
        default: "OFF"

jobs:
  # ==================================================================
  # Job 1 - FastMTP
  # ==================================================================
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout llama.cpp at the FastMTP base commit
        uses: actions/checkout@v4
        with:
          ref: 4df29be4f4c3673f428170fda944a5b19f743bb8

      - name: Install CUDA Toolkit (full default install)
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: ${{ inputs.cuda }}
          method: network

      - name: Register CUDA toolset with MSVC (fallback copy)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if ($LASTEXITCODE -ne 0) {
            throw "vswhere failed (exit $LASTEXITCODE)"
          }

          $dst = Join-Path $vs "MSBuild\Microsoft\VC\v170\BuildCustomizations"
          $src = "$env:CUDA_PATH\extras\visual_studio_integration\MSBuildExtensions"

          if (Test-Path $src) {
            New-Item -ItemType Directory -Force $dst | Out-Null
            Copy-Item "$src\*" $dst -Force
            Write-Host "CUDA MSBuild props copied to $dst"
          } else {
            Write-Host "MSBuildExtensions not at $src - integration likely registered already"
          }

          $global:LASTEXITCODE = 0
          exit 0

      - name: Apply HauhauCS FastMTP patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          curl.exe -L -o fastmtp.patch "https://huggingface.co/HauhauCS/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF/resolve/main/HauhauCS-FastMTP-llama.cpp.patch"
          if ($LASTEXITCODE -ne 0) {
            throw "curl failed (exit $LASTEXITCODE)"
          }

          git apply fastmtp.patch
          if ($LASTEXITCODE -ne 0) {
            throw "git apply failed (exit $LASTEXITCODE)"
          }

          $global:LASTEXITCODE = 0
          exit 0

      - name: Configure (baseline CPU codegen - safe on pre-AVX2 CPUs)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake -S . -B build `
            -DGGML_CUDA=ON `
            -DCMAKE_CUDA_ARCHITECTURES=${{ inputs.cuda_arch }} `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX=OFF `
            -DGGML_AVX2=OFF `
            -DGGML_FMA=OFF `
            -DGGML_F16C=OFF `
            -DGGML_BMI2=OFF `
            -DGGML_SSE42=OFF `
            -DCMAKE_BUILD_TYPE=Release

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed (exit $LASTEXITCODE)"
          }

          $global:LASTEXITCODE = 0
          exit 0

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --build build --config Release -j 4
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed (exit $LASTEXITCODE)"
          }

          $global:LASTEXITCODE = 0
          exit 0

      - name: Collect exes + all DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force dist | Out-Null

          Copy-Item build\bin\Release\*.exe dist\
          Copy-Item build\bin\Release\*.dll dist\

          Get-ChildItem "$env:CUDA_PATH\bin\cudart64_*.dll"   | Copy-Item -Destination dist\
          Get-ChildItem "$env:CUDA_PATH\bin\cublas64_*.dll"   | Copy-Item -Destination dist\
          Get-ChildItem "$env:CUDA_PATH\bin\cublasLt64_*.dll" | Copy-Item -Destination dist\

          Write-Host "Copying MSVC runtime DLLs (FastMTP job)..."
          # v5.11: NEVER append -ErrorAction to a native exe. It is a cmdlet-only
          # parameter and gets forwarded literally to vswhere.exe, which then
          # fails with empty stdout. Suppress stderr with 2>$null instead, wrap
          # in try/catch, and guard before every Join-Path.
          $vswhereExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = ""
          try {
            if (Test-Path $vswhereExe) {
              $raw = & $vswhereExe -latest -property installationPath 2>$null
              $vsPath = [string]($raw | Where-Object { -Not [string]::IsNullOrWhiteSpace([string]$_) } | Select-Object -First 1)
            } else {
              Write-Host "  vswhere.exe not found at $vswhereExe"
            }
          } catch {
            Write-Host "  vswhere invocation failed: $($_.Exception.Message)"
            $vsPath = ""
          }

          $crtDir = $null
          if (-Not [string]::IsNullOrWhiteSpace($vsPath)) {
            $crtRoot = Join-Path $vsPath "VC\Redist\MSVC"
            if (Test-Path $crtRoot) {
              $crtDir = Get-ChildItem -Path $crtRoot -Directory -ErrorAction SilentlyContinue |
                        Sort-Object Name -Descending |
                        ForEach-Object {
                          Get-ChildItem -Path "$($_.FullName)\x64" -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue
                        } | Select-Object -First 1
            } else {
              Write-Host "  VS Redist root not found at $crtRoot; using System32 fallback"
            }
          }

          if ($crtDir) {
            Copy-Item "$($crtDir.FullName)\*.dll" dist\ -Force
            Write-Host "  Copied MSVC CRT from: $($crtDir.FullName)"
          } else {
            Write-Host "  Falling back to System32 for MSVC runtime DLLs"
            foreach ($dll in @("msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")) {
              $src = "$env:WINDIR\System32\$dll"
              if (Test-Path $src) {
                Copy-Item $src dist\ -Force
                Write-Host "  Copied $dll (from System32)"
              } else {
                Write-Host "  WARNING: $dll not found in System32 either"
              }
            }
          }

          Get-ChildItem dist | Format-Table Name,Length

          $global:LASTEXITCODE = 0
          exit 0

      # ==============================================================
      # Upload artifact
      # FastMTP uses BUILD_SHARED_LIBS=ON (CMake default), so the exes
      # in dist\ are small launchers and the shared libraries
      # (llama.dll, ggml.dll, ggml-cuda.dll) are shipped once. Total
      # is ~500 MB, so no filtering is needed - upload dist\ as-is.
      #
      # v5.12: added `if: always()` so a partial failure in a later
      # step still produces the artifact for post-mortem inspection.
      # ==============================================================
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llama-fastmtp-win-cuda
          path: dist/
          retention-days: 30

  # ==================================================================
  # Job 2 - UNIFIED BeeLlama
  # DFlash2 + KVarN + kv-tail + adaptive draft-max + hybrid cache
  # ==================================================================
  beellama-dflash2:
    runs-on: windows-2022
    steps:
      - name: Checkout Anbeeld/beellama.cpp (upstream llama.cpp + DFlash2 + Bee extras)
        uses: actions/checkout@v4
        with:
          repository: Anbeeld/beellama.cpp
          ref: ${{ inputs.beellama_ref }}
          fetch-depth: 0

      # ==============================================================
      # HYBRID CACHE PERFORMANCE PATCHES
      # v5.7: Dropped --3way fallback. Only clean patches applied.
      # ==============================================================
      - name: Apply hybrid cache performance patches (conditional)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Try-ApplyPatch($url, $name) {
            Write-Host "Attempting $name"

            curl.exe -L -sS -o "$name.diff" "$url" 2>&1 | Out-Null
            $curlCode = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            if ($curlCode -ne 0) {
              Write-Host "  curl failed for $name"
              Remove-Item "$name.diff" -ErrorAction SilentlyContinue
              return $false
            }

            git apply --check "$name.diff" 2>&1 | Out-Null
            $checkCode = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            if ($checkCode -ne 0) {
              Write-Host "  $name does not apply cleanly to this ref"
              Write-Host "  $name skipped (will rely on BeeLlama built-in hybrid-cache support)"
              Remove-Item "$name.diff" -ErrorAction SilentlyContinue
              return $false
            }

            git apply "$name.diff" 2>&1 | Out-Null
            $applyCode = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            if ($applyCode -eq 0) {
              Write-Host "  $name applied cleanly"
              Remove-Item "$name.diff" -ErrorAction SilentlyContinue
              return $true
            }

            Write-Host "  $name passed --check but failed to apply; skipping"
            Remove-Item "$name.diff" -ErrorAction SilentlyContinue
            Get-ChildItem -Recurse -Include *.rej,*.orig -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue

            return $false
          }

          # PATCH 1: Fix checkpoint handling for hybrid memory models (PR #24797)
          $p1 = Try-ApplyPatch "https://github.com/ggml-org/llama.cpp/pull/24797.diff" "fix_checkpoint"

          # PATCH 2: Add --cache-reuse-hybrid for mid-prompt edits (PR #29918)
          $p2 = Try-ApplyPatch "https://github.com/ggml-org/llama.cpp/pull/29918.diff" "cache_reuse_hybrid"

          # PATCH 3: Recurrent state shrink/expand for prompt cache (PR #24785)
          $p3 = Try-ApplyPatch "https://github.com/ggml-org/llama.cpp/pull/24785.diff" "recurrent_shrink"

          # PATCH 4: Add --checkpoint-every-nb for incremental checkpoints (PR #20087)
          $p4 = Try-ApplyPatch "https://github.com/ggml-org/llama.cpp/pull/20087.diff" "checkpoint_every_nb"

          $applied = ($p1, $p2, $p3, $p4 | Where-Object { $_ -eq $true } | Measure-Object).Count

          Write-Host ""
          Write-Host "Patches applied: $applied / 4"

          if ($applied -eq 0) {
            Write-Host ""
            Write-Host "No upstream patches applied. Checking for BeeLlama built-in hybrid-cache support..."

            $builtinPatterns = @(
              'cache-reuse-hybrid',
              'checkpoint-every-nb',
              'recurrent.*shrink',
              'pos_min.*attention.*cache',
              'reusable RAM snapshots',
              'transactional state restore',
              'Reworked KV cache and prompt reuse',
              'capability-aware speculative rollback'
            )

            $foundBuiltin = $false

            foreach ($pat in $builtinPatterns) {
              $hit = Get-ChildItem -Path . -Recurse -File -Include *.cpp,*.h,*.md -ErrorAction SilentlyContinue |
                     Select-String -Pattern $pat -List -ErrorAction SilentlyContinue

              if ($hit) {
                Write-Host "  BeeLlama source already contains: $pat"
                $foundBuiltin = $true
              }
            }

            if (-Not $foundBuiltin) {
              Write-Host ""
              Write-Host "Neither upstream patches nor BeeLlama built-in hybrid-cache support detected."
              Write-Host "The binary will NOT have hybrid-cache optimizations."
              Write-Host "Verify beellama_ref is set to main or a ref with built-in hybrid-cache support."
              exit 1
            }

            Write-Host ""
            Write-Host "BeeLlama built-in hybrid-cache support will be used."
          }

          Write-Host ""
          Write-Host "Hybrid cache step complete (applied=$applied/4)"

          $global:LASTEXITCODE = 0
          exit 0

      - name: Verify source contains required speculative features
        shell: pwsh
        run: |
          $requiredPatterns = @(
            'draft-dflash',
            'ngram-map-k4v',
            'kvarn',
            'kv-tail-tokens',
            'kv-tail-type',
            'spec-dm-controller'
          )

          $sourceFound = $true

          foreach ($pattern in $requiredPatterns) {
            $found = Get-ChildItem -Path . -Recurse -File -Include *.cpp,*.h,*.c,*.hpp -ErrorAction SilentlyContinue |
                     Select-String -Pattern $pattern -List -ErrorAction SilentlyContinue

            if (-Not $found) {
              Write-Host "ERROR: Required pattern '$pattern' not found in source code"
              $sourceFound = $false
            } else {
              Write-Host "Found pattern: $pattern"
            }
          }

          if (-Not $sourceFound) {
            Write-Host "Source code verification failed - required features missing"
            exit 1
          }

          Write-Host "All required speculative features present in source code"
          exit 0

      - name: Install CUDA Toolkit (full default install)
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: ${{ inputs.cuda }}
          method: network

      - name: Register CUDA toolset with MSVC (fallback copy)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if ($LASTEXITCODE -ne 0) {
            throw "vswhere failed (exit $LASTEXITCODE)"
          }

          $dst = Join-Path $vs "MSBuild\Microsoft\VC\v170\BuildCustomizations"
          $src = "$env:CUDA_PATH\extras\visual_studio_integration\MSBuildExtensions"

          if (Test-Path $src) {
            New-Item -ItemType Directory -Force $dst | Out-Null
            Copy-Item "$src\*" $dst -Force
            Write-Host "CUDA MSBuild props copied to $dst"
          } else {
            Write-Host "MSBuildExtensions not at $src - integration likely registered already"
          }

          $global:LASTEXITCODE = 0
          exit 0

      # ==============================================================
      # Configure BeeLlama
      # BUILD_SHARED_LIBS=OFF forces static build (fixes the v5.3 stub bug).
      # LLAMA_CURL=OFF removes libcurl.dll dependency.
      # v5.9: static CRT (/MT), OpenMP off, curl hard-disabled.
      # ==============================================================
      - name: Configure (BeeLlama - CUDA FlashAttention incl. KVarN kernels)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake -S . -B build `
            -DGGML_CUDA=ON `
            -DGGML_CUDA_FA=ON `
            -DGGML_CUDA_FA_ALL_QUANTS=${{ inputs.fa_all_quants }} `
            -DGGML_CUDA_KVARN=ON `
            -DGGML_SPECULATIVE=ON `
            -DBUILD_SHARED_LIBS=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_EXAMPLES=ON `
            -DLLAMA_CURL=OFF `
            -DCMAKE_DISABLE_FIND_PACKAGE_CURL=ON `
            -DGGML_OPENMP=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_CUDA_ARCHITECTURES=${{ inputs.cuda_arch }} `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX=OFF `
            -DGGML_AVX2=OFF `
            -DGGML_FMA=OFF `
            -DGGML_F16C=OFF `
            -DGGML_BMI2=OFF `
            -DGGML_SSE42=OFF `
            -DCMAKE_BUILD_TYPE=Release

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed (exit $LASTEXITCODE)"
          }

          Write-Host ""
          Write-Host "--- Pre-flight: checking for unknown CMake vars ---"
          Write-Host "If GGML_CUDA_KVARN / GGML_SPECULATIVE appear as"
          Write-Host "'Manually-specified variables were not used', they do NOT"
          Write-Host "exist at this ref and the binary will lack those features."

          cmake -S . -B build -L 2>&1 |
            Select-String -Pattern "GGML_CUDA_KVARN|GGML_SPECULATIVE|Manually-specified" |
            ForEach-Object { Write-Host $_ }

          $global:LASTEXITCODE = 0
          exit 0

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --build build --config Release -j 4
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed (exit $LASTEXITCODE)"
          }

          $global:LASTEXITCODE = 0
          exit 0

      # ==============================================================
      # Verify build artifacts
      # ==============================================================
      - name: Verify build artifacts (find real llama-server.exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "--- All llama-server.exe on disk ---"
          Get-ChildItem -Recurse -Filter "llama-server.exe" -ErrorAction SilentlyContinue |
            Select-Object FullName, @{N='MB';E={[math]::Round($_.Length/1MB,2)}} |
            Format-Table -AutoSize | Out-String | Write-Host

          $real = Get-ChildItem -Recurse -Filter "llama-server.exe" -ErrorAction SilentlyContinue |
                  Where-Object { $_.Length -gt 1MB } |
                  Select-Object -First 1

          if (-not $real) {
            Write-Host "No llama-server.exe larger than 1 MB found."
            Write-Host "Possible causes:"
            Write-Host "  - BUILD_SHARED_LIBS=ON (produces launcher stub, not real binary)"
            Write-Host "  - Silent link failure (check Build step output)"
            Write-Host "  - Wrong ref (selected ref may predate required CMake flags)"
            exit 1
          }

          Write-Host "Real binary: $($real.FullName) ($([math]::Round($real.Length/1MB,2)) MB)"
          "LLAMA_SERVER_PATH=$($real.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          exit 0

      # ==============================================================
      # Collect exes + all DLLs
      #
      # v5.12 NOTE ON ARTIFACT SIZE:
      # Because BUILD_SHARED_LIBS=OFF, every executable statically embeds
      # llama.cpp + ggml + the CUDA runtime, so each .exe is ~500 MB.
      # This step still copies all of them into dist\ (that's fine - it
      # is only using the runner's local disk). The 32.5 GB problem was
      # in the UPLOAD step, not here. The upload step below now filters
      # down to just the essentials.
      # ==============================================================
      - name: Collect exes + all DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force dist | Out-Null

          $binDir = Split-Path "$env:LLAMA_SERVER_PATH"
          Write-Host "Primary copy from: $binDir"

          Copy-Item "$binDir\*.exe" dist\ -Force -ErrorAction SilentlyContinue
          Copy-Item "$binDir\*.dll" dist\ -Force -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Recursive sweep of build folder for Release .exe/.dll files..."

          $releaseFiles = Get-ChildItem -Path build -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in ".exe", ".dll" -and
              $_.FullName -match '\\Release\\'
            }

          if (-not $releaseFiles) {
            Write-Host "  No .exe/.dll found under build in Release folders."
            Write-Host "  Build tree preview (first 100 entries):"
            Get-ChildItem -Path build -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 100 FullName, Length | Format-Table -AutoSize
          } else {
            foreach ($file in $releaseFiles) {
              $dest = Join-Path "dist" $file.Name

              if (-Not (Test-Path $dest)) {
                Copy-Item -Path $file.FullName -Destination $dest -Force
                Write-Host "  Copied: $($file.Name)  ($([math]::Round($file.Length/1MB,2)) MB)"
              }
            }
          }

          Write-Host ""
          Write-Host "Copying CUDA runtime DLLs (broad sweep)..."
          Get-ChildItem "$env:CUDA_PATH\bin\*.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "^(cudart|cublas|cublasLt|nvrtc|nvJitLink|nvToolsExt)" } |
            ForEach-Object {
              Copy-Item $_.FullName dist\ -Force
              Write-Host "  Copied: $($_.Name)"
            }

          Write-Host ""
          Write-Host "--- Final dist contents (sorted) ---"
          Get-ChildItem dist | Sort-Object Name |
            Format-Table Name, @{N='MB';E={[math]::Round($_.Length/1MB,3)}} -AutoSize

          if (-Not (Test-Path "dist\llama-server.exe")) {
            Write-Host "llama-server.exe missing from dist after collection"
            exit 1
          }

          exit 0

      # ==============================================================
      # Copy runtime dependencies
      # v5.8: copies MSVC CRT DLLs from VS Redist with System32 fallback
      # so the downloaded artifact is self-contained on the user's
      # Windows machine. Does NOT execute anything - pure file copy.
      # v5.11: vswhere call hardened (no -ErrorAction on native exe,
      # try/catch, null/empty guard before Join-Path).
      # ==============================================================
      - name: Copy runtime dependencies (MSVC CRT + System32 fallback)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $criticalDlls = @(
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "msvcp140_atomic_wait.dll",
            "msvcp140_codecvt_ids.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "concrt140.dll",
            "vcomp140.dll"
          )
          $copied = @{}

          Write-Host "Searching VS Redist for MSVC runtime DLLs..."
          # v5.11: NEVER append -ErrorAction to a native exe (forwarded
          # literally, breaks vswhere). Same fix as the FastMTP job.
          $vswhereExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = ""
          try {
            if (Test-Path $vswhereExe) {
              $raw = & $vswhereExe -latest -property installationPath 2>$null
              $vsPath = [string]($raw | Where-Object { -Not [string]::IsNullOrWhiteSpace([string]$_) } | Select-Object -First 1)
            } else {
              Write-Host "  vswhere.exe not found at $vswhereExe"
            }
          } catch {
            Write-Host "  vswhere invocation failed: $($_.Exception.Message)"
            $vsPath = ""
          }

          if (-Not [string]::IsNullOrWhiteSpace($vsPath)) {
            $redistRoot = Join-Path $vsPath "VC\Redist\MSVC"
            if (Test-Path $redistRoot) {
              $crtDirs = Get-ChildItem -Path $redistRoot -Directory -ErrorAction SilentlyContinue |
                         Sort-Object Name -Descending |
                         ForEach-Object {
                           Get-ChildItem -Path (Join-Path $_.FullName "x64") -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue
                         }
              foreach ($crtDir in $crtDirs) {
                foreach ($dll in $criticalDlls) {
                  if ($copied.ContainsKey($dll)) { continue }
                  $src = Join-Path $crtDir.FullName $dll
                  if (Test-Path $src) {
                    Copy-Item $src dist\ -Force
                    Write-Host "  Copied $dll  (from VS Redist)"
                    $copied[$dll] = $true
                  }
                }
              }
            } else {
              Write-Host "  VS Redist root not found at $redistRoot; relying on System32 fallback"
            }
          } else {
            Write-Host "  vswhere returned no VS installation path; relying on System32 fallback"
          }

          Write-Host ""
          Write-Host "Filling any gaps from System32..."
          foreach ($dll in $criticalDlls) {
            if ($copied.ContainsKey($dll)) { continue }
            $src = Join-Path "$env:WINDIR\System32" $dll
            if (Test-Path $src) {
              Copy-Item $src dist\ -Force
              Write-Host "  Copied $dll  (from System32)"
              $copied[$dll] = $true
            }
          }

          Write-Host ""
          Write-Host "--- Runtime dependency summary ---"
          $missingCritical = @()
          foreach ($dll in @("msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")) {
            if ($copied.ContainsKey($dll)) {
              Write-Host "  OK: $dll"
            } else {
              Write-Host "  MISSING: $dll"
              $missingCritical += $dll
            }
          }

          if ($missingCritical.Count -gt 0) {
            Write-Host ""
            Write-Host "WARNING: Critical MSVC runtime DLLs still missing: $($missingCritical -join ', ')"
            Write-Host "  The user's machine may already have these installed via the VC++ Redistributable."
          } else {
            Write-Host ""
            Write-Host "All critical MSVC runtime DLLs present in dist\"
          }

          exit 0

      # ==============================================================
      # v5.10 STEP: Verify binary contains required feature strings
      # --------------------------------------------------------------
      # Pure file scan via findstr. Does NOT execute the binary, does
      # NOT load DLLs, does NOT require a GPU. GitHub-hosted runners
      # have no NVIDIA GPU, so runtime testing happens on the user's
      # GPU machine - the CI runner only verifies build correctness.
      # ==============================================================
      - name: Verify binary contains required feature strings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $exe = "dist\llama-server.exe"
          if (-Not (Test-Path $exe)) {
            Write-Host "ERROR: $exe not found"
            Get-ChildItem dist -ErrorAction SilentlyContinue | Format-Table Name, Length -AutoSize
            exit 1
          }

          $exeInfo = Get-Item $exe
          Write-Host "Binary: $($exeInfo.FullName)"
          Write-Host "Size:   $($exeInfo.Length) bytes ($([math]::Round($exeInfo.Length/1MB,2)) MB)"
          Write-Host ""

          if ($exeInfo.Length -lt 50MB) {
            Write-Host "ERROR: Binary is only $([math]::Round($exeInfo.Length/1MB,2)) MB."
            Write-Host "       A real CUDA llama-server.exe is several hundred MB."
            Write-Host "       This suggests a launcher stub or failed link."
            exit 1
          }

          $requiredFeatures = @(
            'draft-dflash',
            'ngram-map-k4v',
            'kvarn',
            'kv-tail-tokens',
            'kv-tail-type',
            'spec-dm-controller'
          )

          $optionalFeatures = @(
            'cache-reuse-hybrid',
            'checkpoint-every-nb'
          )

          Write-Host "--- Hard requirements (binary string scan) ---"
          $missing = @()
          foreach ($needle in $requiredFeatures) {
            findstr /M /C:"$needle" $exe 2>&1 | Out-Null
            $found = ($LASTEXITCODE -eq 0)
            $global:LASTEXITCODE = 0
            if ($found) {
              Write-Host "OK:      $needle"
            } else {
              Write-Host "MISSING: $needle"
              $missing += $needle
            }
          }

          Write-Host ""
          Write-Host "--- Optional (hybrid cache; informational) ---"
          foreach ($needle in $optionalFeatures) {
            findstr /M /C:"$needle" $exe 2>&1 | Out-Null
            $found = ($LASTEXITCODE -eq 0)
            $global:LASTEXITCODE = 0
            if ($found) {
              Write-Host "Present: $needle"
            } else {
              Write-Host "Absent:  $needle  (built-in hybrid-cache behavior still active)"
            }
          }

          Write-Host ""
          Write-Host "=== Verification Summary ==="
          Write-Host "Required found:   $($requiredFeatures.Count - $missing.Count) / $($requiredFeatures.Count)"
          Write-Host "Required missing: $($missing.Count)"

          if ($missing.Count -gt 0) {
            Write-Host ""
            Write-Host "FAILED: The following features are not present in the binary:"
            $missing | ForEach-Object { Write-Host "  - $_" }
            Write-Host ""
            Write-Host "Most likely causes:"
            Write-Host "  1. Wrong beellama_ref (must be a ref that supports these flags)"
            Write-Host "  2. CMake flags silently ignored (check Pre-flight output)"
            Write-Host "  3. Wrong CMake target built (check Build step output)"
            exit 1
          }

          Write-Host ""
          Write-Host "All required feature strings present in the binary."
          Write-Host "The artifact is ready for download and testing on a GPU machine."
          exit 0

      # ==============================================================
      # Upload artifact (v5.12: FILTERED - was 32.5 GB, now ~500 MB)
      # --------------------------------------------------------------
      # Because BUILD_SHARED_LIBS=OFF, every one of the ~120 executables
      # in dist\ is a fully static binary of ~500 MB. Uploading all of
      # them produced a 32.5 GB artifact. This is not needed.
      #
      # llm-studio only needs llama-server.exe. llama-cli.exe and
      # llama-bench.exe are included because they are genuinely useful
      # for manual testing and benchmarking. Every other llama-*.exe
      # (~50 tool binaries) and every test-*.exe (~100 test binaries)
      # is excluded from the upload.
      #
      # DLLs (all of them) are included so the artifact is self-contained
      # on the user's Windows machine. Total is ~1.5 GB uncompressed,
      # ~500 MB compressed - matching FastMTP's size profile.
      #
      # v5.12: added `if: always()` so a partial failure in a later step
      # still produces the artifact for post-mortem inspection.
      # ==============================================================
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llama-beellama-dflash2-win-cuda
          path: |
            dist/llama-server.exe
            dist/llama-cli.exe
            dist/llama-bench.exe
            dist/*.dll
          retention-days: 30